<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546e7a"/></marker>
  </defs>
  <rect width="800" height="400" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Sampling — Flujo Inverso: Server pide al LLM</text>

  <!-- Actors -->
  <rect x="40" y="78" width="100" height="28" rx="4" fill="#4caf50"/><text x="90" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Server</text>
  <rect x="290" y="78" width="100" height="28" rx="4" fill="#0288d1"/><text x="340" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Host/Client</text>
  <rect x="530" y="78" width="100" height="28" rx="4" fill="#ff9800"/><text x="580" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Usuario</text>
  <rect x="700" y="78" width="70" height="28" rx="4" fill="#9c27b0"/><text x="735" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">LLM</text>
  <line x1="90" y1="106" x2="90" y2="380" stroke="#4caf50" stroke-width="2"/>
  <line x1="340" y1="106" x2="340" y2="380" stroke="#0288d1" stroke-width="2"/>
  <line x1="580" y1="106" x2="580" y2="380" stroke="#ff9800" stroke-width="2"/>
  <line x1="735" y1="106" x2="735" y2="380" stroke="#9c27b0" stroke-width="2"/>

  <!-- Step 1: Server needs LLM -->
  <rect x="20" y="120" width="140" height="26" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="90" y="138" text-anchor="middle" fill="#2e7d32" font-size="9">Necesita analisis LLM</text>

  <!-- Step 2: sampling/createMessage -->
  <line x1="92" y1="160" x2="338" y2="160" stroke="#4caf50" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="140" y="148" width="160" height="20" rx="4" fill="#e8f5e9"/><text x="220" y="163" text-anchor="middle" fill="#2e7d32" font-size="9" font-weight="600">sampling/createMessage</text>

  <!-- Step 3: Host asks user consent -->
  <line x1="342" y1="195" x2="578" y2="195" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="390" y="183" width="150" height="20" rx="4" fill="#e1f5fe"/><text x="465" y="198" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">Mostrar al usuario</text>

  <!-- Step 4: User approves -->
  <line x1="578" y1="225" x2="342" y2="225" stroke="#ff9800" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="400" y="213" width="130" height="20" rx="4" fill="#fff3e0"/><text x="465" y="228" text-anchor="middle" fill="#e65100" font-size="9" font-weight="600">Aprueba / Modifica</text>

  <!-- Step 5: Host sends to LLM -->
  <line x1="342" y1="260" x2="733" y2="260" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="248" width="190" height="20" rx="4" fill="#e1f5fe"/><text x="535" y="263" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">Envia mensajes al LLM</text>

  <!-- Step 6: LLM responds -->
  <line x1="733" y1="295" x2="342" y2="295" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="283" width="190" height="20" rx="4" fill="#f3e5f5"/><text x="535" y="298" text-anchor="middle" fill="#7b1fa2" font-size="9" font-weight="600">Respuesta generada</text>

  <!-- Step 7: Host returns to server -->
  <line x1="338" y1="330" x2="92" y2="330" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="140" y="318" width="160" height="20" rx="4" fill="#e1f5fe"/><text x="220" y="333" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">result: {content: ...}</text>

  <!-- Step 8: Server uses result -->
  <rect x="20" y="350" width="140" height="26" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="90" y="368" text-anchor="middle" fill="#2e7d32" font-size="9">Usa analisis del LLM</text>

  <!-- Note -->
  <text x="400" y="394" text-anchor="middle" fill="#c62828" font-size="10" font-weight="600">Human-in-the-loop: El usuario SIEMPRE puede aprobar, modificar o rechazar</text>
</svg>
