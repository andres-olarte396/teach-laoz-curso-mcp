<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
    <marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9c27b0"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ff9800"/></marker>
  </defs>
  <rect width="800" height="500" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Sampling — Flujo Inverso: Server pide al LLM</text>

  <!-- Actors / Lifelines -->
  <rect x="50" y="75" width="100" height="28" rx="4" fill="#ff9800" filter="url(#s)"/><text x="100" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Usuario</text>
  <rect x="250" y="75" width="100" height="28" rx="4" fill="#0288d1" filter="url(#s)"/><text x="300" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Host/Client</text>
  <rect x="450" y="75" width="100" height="28" rx="4" fill="#9c27b0" filter="url(#s)"/><text x="500" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">LLM</text>
  <rect x="650" y="75" width="100" height="28" rx="4" fill="#4caf50" filter="url(#s)"/><text x="700" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Server MCP</text>
  
  <line x1="100" y1="103" x2="100" y2="440" stroke="#ff9800" stroke-width="2" stroke-dasharray="4"/>
  <line x1="300" y1="103" x2="300" y2="440" stroke="#0288d1" stroke-width="2" stroke-dasharray="4"/>
  <line x1="500" y1="103" x2="500" y2="440" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4"/>
  <line x1="700" y1="103" x2="700" y2="440" stroke="#4caf50" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 1: Server needs LLM -->
  <rect x="630" y="120" width="140" height="26" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="700" y="138" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Requiere Análisis LLM</text>

  <!-- Step 2: sampling/createMessage (Server -> Host) -->
  <line x1="700" y1="170" x2="310" y2="170" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="500" y="165" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">sampling/createMessage</text>

  <!-- Step 3: Host asks User (Host -> User) -->
  <line x1="300" y1="210" x2="110" y2="210" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="205" y="205" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Solicita Permiso</text>

  <!-- Step 4: User approves (User -> Host) -->
  <line x1="100" y1="250" x2="290" y2="250" stroke="#ff9800" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="205" y="245" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">Aprueba / Modifica</text>

  <!-- Step 5: Host forwards to LLM (Host -> LLM) -->
  <line x1="300" y1="290" x2="490" y2="290" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="400" y="285" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Envía Prompt Generado</text>

  <!-- Step 6: LLM responds (LLM -> Host) -->
  <line x1="500" y1="330" x2="310" y2="330" stroke="#9c27b0" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="400" y="325" text-anchor="middle" fill="#7b1fa2" font-size="11" font-weight="600">Respuesta Generada</text>

  <!-- Step 7: Host returns to Server (Host -> Server) -->
  <line x1="300" y1="370" x2="690" y2="370" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="500" y="365" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Result: { content: ... }</text>

  <!-- Step 8: Server uses result -->
  <rect x="630" y="400" width="140" height="26" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="700" y="418" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Usa Análisis del LLM</text>

  <!-- Note -->
  <rect x="150" y="455" width="500" height="28" rx="8" fill="#ffebee" stroke="#e53935"/>
  <text x="400" y="474" text-anchor="middle" fill="#c62828" font-size="11" font-weight="700">Human-in-the-loop: El usuario SIEMPRE puede aprobar, modificar o rechazar</text>
</svg>
