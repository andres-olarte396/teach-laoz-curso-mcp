<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
  </defs>
  <rect width="800" height="380" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Elicitation — Formularios Dinamicos</text>

  <!-- Server sends elicitation -->
  <rect x="30" y="80" width="350" height="270" rx="10" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="80" width="350" height="30" rx="10" fill="#0288d1"/>
  <rect x="30" y="96" width="350" height="14" fill="#0288d1"/>
  <text x="205" y="100" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Server envia: elicitation/create</text>
  <text x="50" y="130" fill="#01579b" font-size="11" font-weight="600">message:</text><text x="120" y="130" fill="#263238" font-size="10">"Confirmar deploy a produccion?"</text>
  <text x="50" y="155" fill="#01579b" font-size="11" font-weight="600">requestedSchema:</text>
  <!-- Field 1 -->
  <rect x="50" y="168" width="310" height="36" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
  <text x="60" y="185" fill="#01579b" font-size="10" font-weight="600">confirm</text>
  <text x="130" y="185" fill="#263238" font-size="10">type: boolean</text>
  <text x="280" y="185" fill="#546e7a" font-size="9">required</text>
  <text x="60" y="198" fill="#546e7a" font-size="9">Confirmar la operacion?</text>
  <!-- Field 2 -->
  <rect x="50" y="212" width="310" height="36" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
  <text x="60" y="229" fill="#01579b" font-size="10" font-weight="600">environment</text>
  <text x="155" y="229" fill="#263238" font-size="10">type: string, enum</text>
  <text x="60" y="242" fill="#546e7a" font-size="9">["staging", "production"]</text>
  <!-- Field 3 -->
  <rect x="50" y="256" width="310" height="36" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
  <text x="60" y="273" fill="#01579b" font-size="10" font-weight="600">reason</text>
  <text x="120" y="273" fill="#263238" font-size="10">type: string</text>
  <text x="280" y="273" fill="#546e7a" font-size="9">optional</text>
  <text x="60" y="286" fill="#546e7a" font-size="9">Motivo del deploy</text>
  <!-- Status types -->
  <text x="50" y="322" fill="#263238" font-size="10" font-weight="600">Posibles respuestas del usuario:</text>
  <rect x="50" y="330" width="80" height="18" rx="3" fill="#4caf50"/><text x="90" y="343" text-anchor="middle" fill="#fff" font-size="9">accepted</text>
  <rect x="140" y="330" width="80" height="18" rx="3" fill="#f44336"/><text x="180" y="343" text-anchor="middle" fill="#fff" font-size="9">declined</text>
  <rect x="230" y="330" width="80" height="18" rx="3" fill="#ff9800"/><text x="270" y="343" text-anchor="middle" fill="#fff" font-size="9">cancelled</text>

  <!-- User sees form -->
  <rect x="420" y="80" width="350" height="270" rx="10" fill="#fff" stroke="#ff9800" stroke-width="2" filter="url(#s)"/>
  <rect x="420" y="80" width="350" height="30" rx="10" fill="#ff9800"/>
  <rect x="420" y="96" width="350" height="14" fill="#ff9800"/>
  <text x="595" y="100" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Host muestra al usuario</text>
  <text x="595" y="130" text-anchor="middle" fill="#263238" font-size="12" font-weight="600">Confirmar deploy a produccion?</text>

  <!-- Form fields rendered -->
  <text x="450" y="160" fill="#263238" font-size="10">Confirmar:</text>
  <rect x="540" y="148" width="60" height="20" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="570" y="163" text-anchor="middle" fill="#4caf50" font-size="10" font-weight="700">✓ Si</text>
  <rect x="610" y="148" width="60" height="20" rx="4" fill="#ffebee" stroke="#e0e0e0" stroke-width="1"/>
  <text x="640" y="163" text-anchor="middle" fill="#bdbdbd" font-size="10">No</text>

  <text x="450" y="200" fill="#263238" font-size="10">Entorno:</text>
  <rect x="540" y="186" width="200" height="24" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="550" y="203" fill="#263238" font-size="10">production ▾</text>

  <text x="450" y="240" fill="#263238" font-size="10">Motivo (opcional):</text>
  <rect x="450" y="248" width="290" height="40" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="460" y="268" fill="#9e9e9e" font-size="10">Release v2.1.0...</text>

  <!-- Buttons -->
  <rect x="540" y="310" width="100" height="30" rx="6" fill="#4caf50" filter="url(#s)"/>
  <text x="590" y="330" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Confirmar</text>
  <rect x="655" y="310" width="90" height="30" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="700" y="330" text-anchor="middle" fill="#546e7a" font-size="11">Cancelar</text>
</svg>
