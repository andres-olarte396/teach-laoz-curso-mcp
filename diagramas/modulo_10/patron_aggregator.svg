<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#311b92"/><stop offset="100%" stop-color="#512da8"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#512da8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Patrón: Aggregator (Host)</text>

  <!-- LLM / User Layer -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="105" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="700">LLM</text>
  <text x="400" y="125" text-anchor="middle" fill="#7b1fa2" font-size="11">Interactúa con un solo endpoint</text>

  <line x1="400" y1="140" x2="400" y2="180" stroke="#9c27b0" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Aggregator Client (Host) -->
  <rect x="250" y="190" width="300" height="130" rx="12" fill="#ede7f6" stroke="#512da8" stroke-width="2.5" filter="url(#s)"/>
  <rect x="250" y="190" width="300" height="32" rx="12" fill="#512da8"/>
  <rect x="250" y="210" width="300" height="12" fill="#512da8"/>
  <text x="400" y="212" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">MCP Client (Aggregator)</text>

  <rect x="270" y="235" width="260" height="70" rx="6" fill="#fff" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="400" y="255" text-anchor="middle" fill="#4527a0" font-size="12" font-weight="700">Router Inteligente</text>
  <text x="400" y="275" text-anchor="middle" fill="#4527a0" font-size="11">Mapea nombres de tools a conexiones</text>
  <text x="400" y="295" text-anchor="middle" fill="#4527a0" font-size="11">Agrega todas las tools en una lista</text>

  <!-- Server 1 -->
  <line x1="300" y1="320" x2="200" y2="360" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="100" y="370" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="180" y="400" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server A</text>
  <text x="180" y="420" text-anchor="middle" fill="#546e7a" font-size="10">stdio</text>

  <!-- Server 2 -->
  <line x1="400" y1="320" x2="400" y2="360" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="320" y="370" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="400" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server B</text>
  <text x="400" y="420" text-anchor="middle" fill="#546e7a" font-size="10">Streamable HTTP</text>

  <!-- Server 3 -->
  <line x1="500" y1="320" x2="600" y2="360" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="540" y="370" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="620" y="400" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server C</text>
  <text x="620" y="420" text-anchor="middle" fill="#546e7a" font-size="10">SSE</text>

  <rect x="40" y="160" width="180" height="120" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Características:</text>
  <text x="50" y="210" fill="#ef6c00" font-size="11">• Lógica en el cliente.</text>
  <text x="50" y="230" fill="#ef6c00" font-size="11">• Usado por Claude Desktop.</text>
  <text x="50" y="250" fill="#ef6c00" font-size="11">• No hay middleware.</text>
  <text x="50" y="270" fill="#ef6c00" font-size="11">• Conexiones directas.</text>

</svg>
