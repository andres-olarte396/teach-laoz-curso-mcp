<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#311b92"/><stop offset="100%" stop-color="#512da8"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#512da8"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Patrón: Federación (Servidor Híbrido)</text>

  <!-- Client -->
  <rect x="40" y="180" width="140" height="100" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="110" y="210" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">MCP Client</text>
  <text x="110" y="235" text-anchor="middle" fill="#0288d1" font-size="11">Envía requests a</text>
  <text x="110" y="250" text-anchor="middle" fill="#0288d1" font-size="11">un único Servidor</text>

  <line x1="180" y1="230" x2="260" y2="230" stroke="#0288d1" stroke-width="2.5" marker-end="url(#ac)"/>

  <!-- Federated Server -->
  <rect x="260" y="100" width="300" height="280" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2.5" filter="url(#s)"/>
  <rect x="260" y="100" width="300" height="32" rx="12" fill="#4caf50"/>
  <rect x="260" y="120" width="300" height="12" fill="#4caf50"/>
  <text x="410" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Servidor MCP (Federador)</text>

  <rect x="280" y="150" width="260" height="60" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
  <text x="410" y="175" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="700">Lógica Propia (Tools Locales)</text>
  <text x="410" y="195" text-anchor="middle" fill="#546e7a" font-size="10">Ej. Consulta a base de datos local</text>

  <line x1="280" y1="230" x2="540" y2="230" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="410" y="245" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="700">+ Actúa como CLIENTE internamente</text>

  <rect x="280" y="260" width="260" height="100" rx="6" fill="#ede7f6" stroke="#512da8" stroke-width="1.5"/>
  <text x="410" y="285" text-anchor="middle" fill="#4527a0" font-size="12" font-weight="700">Sub-cliente MCP Interno</text>
  <rect x="300" y="300" width="220" height="20" rx="4" fill="#fff"/>
  <text x="410" y="314" text-anchor="middle" fill="#512da8" font-size="10">Conexión a Servidor Externo 1</text>
  <rect x="300" y="330" width="220" height="20" rx="4" fill="#fff"/>
  <text x="410" y="344" text-anchor="middle" fill="#512da8" font-size="10">Conexión a Servidor Externo 2</text>

  <!-- External Servers -->
  <line x1="540" y1="310" x2="620" y2="280" stroke="#512da8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="620" y="230" width="140" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="690" y="255" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Servidor X</text>
  <text x="690" y="275" text-anchor="middle" fill="#546e7a" font-size="10">Sistema de Tickets</text>

  <line x1="540" y1="340" x2="620" y2="370" stroke="#512da8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="620" y="340" width="140" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="690" y="365" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Servidor Y</text>
  <text x="690" y="385" text-anchor="middle" fill="#546e7a" font-size="10">API de Clima</text>

  <rect x="40" y="300" width="200" height="80" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="140" y="320" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Ventaja:</text>
  <text x="50" y="340" fill="#ef6c00" font-size="11">El servidor compone múltiples</text>
  <text x="50" y="355" fill="#ef6c00" font-size="11">fuentes (delegando a otros servers)</text>
  <text x="50" y="370" fill="#ef6c00" font-size="11">y añade su propia lógica encima.</text>

</svg>
