<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#311b92"/><stop offset="100%" stop-color="#512da8"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#512da8"/></marker>
  </defs>
  <rect width="1000" height="600" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1000" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="1000" height="32" fill="url(#h)"/>
  <text x="500" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Patrón de Arquitectura: Gateway (Middle-tier)</text>

  <!-- Multiple Clients -->
  <rect x="60" y="160" width="160" height="220" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="140" y="195" text-anchor="middle" fill="#01579b" font-size="16" font-weight="700">Clientes</text>
  
  <rect x="80" y="220" width="120" height="36" rx="4" fill="#fff"/>
  <text x="140" y="243" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="600">Claude Desktop</text>

  <rect x="80" y="270" width="120" height="36" rx="4" fill="#fff"/>
  <text x="140" y="293" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="600">Cursor IDE</text>

  <rect x="80" y="320" width="120" height="36" rx="4" fill="#fff"/>
  <text x="140" y="343" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="600">Agente Python</text>

  <line x1="220" y1="270" x2="320" y2="270" stroke="#0288d1" stroke-width="3" marker-end="url(#m-blue)"/>

  <!-- Gateway Proxy -->
  <rect x="320" y="100" width="360" height="360" rx="12" fill="#ede7f6" stroke="#512da8" stroke-width="2.5" filter="url(#s)"/>
  <rect x="320" y="100" width="360" height="36" rx="12" fill="#512da8"/>
  <rect x="320" y="120" width="360" height="16" fill="#512da8"/>
  <text x="500" y="124" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">MCP Gateway (Proxy Central)</text>

  <rect x="350" y="160" width="300" height="50" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" fill="#e65100" font-size="14" font-weight="700">Autenticación y Rate Limiting</text>

  <rect x="350" y="230" width="300" height="50" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="500" y="260" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="700">Métricas y Audit Logging</text>

  <rect x="350" y="300" width="300" height="50" rx="6" fill="#fff" stroke="#f44336" stroke-width="1.5"/>
  <text x="500" y="330" text-anchor="middle" fill="#c62828" font-size="14" font-weight="700">Políticas y Filtrado de Tools</text>

  <rect x="350" y="370" width="300" height="70" rx="6" fill="#fff" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="500" y="400" text-anchor="middle" fill="#4527a0" font-size="14" font-weight="700">Enrutamiento (Internal Aggregator)</text>
  <text x="500" y="420" text-anchor="middle" fill="#4527a0" font-size="12">Se presenta como 1 solo Servidor al Cliente</text>

  <!-- External Servers -->
  <line x1="680" y1="200" x2="780" y2="150" stroke="#512da8" stroke-width="3" marker-end="url(#m-purple)"/>
  <rect x="780" y="110" width="160" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="860" y="145" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Backend A</text>
  <text x="860" y="165" text-anchor="middle" fill="#546e7a" font-size="12">Base de Datos</text>

  <line x1="680" y1="280" x2="780" y2="280" stroke="#512da8" stroke-width="3" marker-end="url(#m-purple)"/>
  <rect x="780" y="240" width="160" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="860" y="275" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Backend B</text>
  <text x="860" y="295" text-anchor="middle" fill="#546e7a" font-size="12">API Externa</text>

  <line x1="680" y1="360" x2="780" y2="410" stroke="#512da8" stroke-width="3" marker-end="url(#m-purple)"/>
  <rect x="780" y="370" width="160" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="860" y="405" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Backend C</text>
  <text x="860" y="425" text-anchor="middle" fill="#546e7a" font-size="12">Sistema Legacy</text>

  <!-- Footer -->
  <rect x="60" y="480" width="880" height="90" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="500" y="515" text-anchor="middle" fill="#e65100" font-size="15" font-weight="700">Ideal para Entornos de Producción Empresariales</text>
  <text x="500" y="545" text-anchor="middle" fill="#ef6c00" font-size="14">Centraliza el control, estandariza la autenticación y oculta la topología interna del sistema.</text>
</svg>
