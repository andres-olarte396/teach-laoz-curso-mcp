<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#311b92"/><stop offset="100%" stop-color="#512da8"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#512da8"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Patrón: Gateway (Middle-tier)</text>

  <!-- Multiple Clients -->
  <rect x="40" y="160" width="120" height="180" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="100" y="185" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">Clientes</text>
  
  <rect x="50" y="200" width="100" height="30" rx="4" fill="#fff"/>
  <text x="100" y="220" text-anchor="middle" fill="#0288d1" font-size="11">Claude Desktop</text>

  <rect x="50" y="240" width="100" height="30" rx="4" fill="#fff"/>
  <text x="100" y="260" text-anchor="middle" fill="#0288d1" font-size="11">Cursor IDE</text>

  <rect x="50" y="280" width="100" height="30" rx="4" fill="#fff"/>
  <text x="100" y="300" text-anchor="middle" fill="#0288d1" font-size="11">Agente Python</text>

  <line x1="160" y1="250" x2="250" y2="250" stroke="#0288d1" stroke-width="2.5" marker-end="url(#ac)"/>

  <!-- Gateway Proxy -->
  <rect x="250" y="110" width="300" height="280" rx="12" fill="#ede7f6" stroke="#512da8" stroke-width="2.5" filter="url(#s)"/>
  <rect x="250" y="110" width="300" height="32" rx="12" fill="#512da8"/>
  <rect x="250" y="130" width="300" height="12" fill="#512da8"/>
  <text x="400" y="132" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">MCP Gateway (Proxy Central)</text>

  <rect x="270" y="160" width="260" height="40" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="400" y="185" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Auth & Rate Limiting</text>

  <rect x="270" y="210" width="260" height="40" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" fill="#7b1fa2" font-size="12" font-weight="700">Audit Logging & Metrics</text>

  <rect x="270" y="260" width="260" height="40" rx="6" fill="#fff" stroke="#f44336" stroke-width="1.5"/>
  <text x="400" y="285" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">Políticas & Filtrado de Tools</text>

  <rect x="270" y="310" width="260" height="60" rx="6" fill="#fff" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="400" y="335" text-anchor="middle" fill="#4527a0" font-size="12" font-weight="700">Enrutamiento (Aggregator interno)</text>
  <text x="400" y="355" text-anchor="middle" fill="#4527a0" font-size="10">El Gateway se presenta como 1 Servidor al Cliente</text>

  <!-- External Servers -->
  <line x1="550" y1="200" x2="630" y2="160" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="630" y="120" width="130" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="695" y="155" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Backend A</text>
  <text x="695" y="175" text-anchor="middle" fill="#546e7a" font-size="10">Base de Datos</text>

  <line x1="550" y1="250" x2="630" y2="250" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="630" y="210" width="130" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="695" y="245" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Backend B</text>
  <text x="695" y="265" text-anchor="middle" fill="#546e7a" font-size="10">API Externa</text>

  <line x1="550" y1="300" x2="630" y2="340" stroke="#512da8" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="630" y="300" width="130" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="695" y="335" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Backend C</text>
  <text x="695" y="355" text-anchor="middle" fill="#546e7a" font-size="10">Sistema Legacy</text>

  <rect x="40" y="360" width="180" height="90" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="130" y="380" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Ideal para Producción:</text>
  <text x="50" y="405" fill="#ef6c00" font-size="11">• Control centralizado.</text>
  <text x="50" y="425" fill="#ef6c00" font-size="11">• Oculta topología interna.</text>
</svg>
