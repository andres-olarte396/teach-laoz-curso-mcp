<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00695c"/><stop offset="100%" stop-color="#00897b"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00897b"/></marker>
  </defs>
  <rect width="1000" height="500" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1000" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="1000" height="32" fill="url(#h)"/>
  <text x="500" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Composición de Servidores FastMCP</text>

  <!-- Main App Background -->
  <rect x="40" y="80" width="920" height="380" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="80" width="920" height="36" rx="12" fill="#00897b"/>
  <rect x="40" y="100" width="920" height="16" fill="#00897b"/>
  <text x="500" y="104" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">App Principal (Main Server)</text>

  <!-- Module 1: Main Server Native Tools -->
  <rect x="80" y="140" width="240" height="120" rx="8" fill="#fff" stroke="#00897b" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" fill="#00695c" font-size="14" font-weight="700">Herramientas Nativas</text>
  <text x="200" y="190" text-anchor="middle" fill="#00695c" font-size="12">Funciones decoradas</text>
  <rect x="100" y="205" width="200" height="40" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="1"/>
  <text x="200" y="230" text-anchor="middle" fill="#00695c" font-size="13" font-weight="600">mcp = FastMCP("Main")</text>

  <!-- Module 2: FileSystem (Local Sub-server) -->
  <rect x="380" y="140" width="240" height="120" rx="8" fill="#fff" stroke="#ff9800" stroke-width="2" stroke-dasharray="4"/>
  <text x="500" y="170" text-anchor="middle" fill="#e65100" font-size="14" font-weight="700">Módulo Secundario</text>
  <text x="500" y="190" text-anchor="middle" fill="#e65100" font-size="12">Sub-servidor instanciado local</text>
  <rect x="400" y="205" width="200" height="40" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="500" y="230" text-anchor="middle" fill="#e65100" font-size="13" font-weight="600">fs_server = FastMCP("FS")</text>

  <!-- Module 3: Import (Remote/Package) -->
  <rect x="680" y="140" width="240" height="120" rx="8" fill="#fff" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4"/>
  <text x="800" y="170" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="700">Módulo Externo</text>
  <text x="800" y="190" text-anchor="middle" fill="#7b1fa2" font-size="12">Paquete PyPI / NPM</text>
  <rect x="700" y="205" width="200" height="40" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="800" y="230" text-anchor="middle" fill="#7b1fa2" font-size="13" font-weight="600">mcp-server-postgres</text>

  <!-- Arrows mapping to Catalog -->
  <line x1="200" y1="260" x2="200" y2="320" stroke="#00897b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="210" y="295" text-anchor="start" fill="#00695c" font-size="12" font-weight="600">Nativas</text>

  <line x1="500" y1="260" x2="500" y2="320" stroke="#00897b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="510" y="295" text-anchor="start" fill="#00695c" font-size="14" font-weight="700">mcp.mount(fs)</text>

  <line x1="800" y1="260" x2="800" y2="320" stroke="#00897b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="810" y="295" text-anchor="start" fill="#00695c" font-size="14" font-weight="700">mcp.import_server(...)</text>

  <!-- Resulting Tools Unified Catalog -->
  <rect x="60" y="325" width="880" height="115" rx="8" fill="#b2dfdb" stroke="#00897b" stroke-width="1.5"/>
  <text x="500" y="355" text-anchor="middle" fill="#004d40" font-size="16" font-weight="700">Catálogo Unificado de Herramientas (con Prefijos Automáticos)</text>
  
  <!-- Individual Tools matched to columns -->
  <rect x="80" y="375" width="240" height="45" rx="6" fill="#fff" filter="url(#s)" stroke="#00897b" stroke-width="1"/>
  <text x="200" y="402" text-anchor="middle" fill="#00695c" font-size="14" font-weight="600">my_local_tool</text>
  
  <rect x="380" y="375" width="240" height="45" rx="6" fill="#fff" filter="url(#s)" stroke="#ff9800" stroke-width="1"/>
  <text x="500" y="402" text-anchor="middle" fill="#e65100" font-size="14" font-weight="600">fs__read_file</text>

  <rect x="680" y="375" width="240" height="45" rx="6" fill="#fff" filter="url(#s)" stroke="#9c27b0" stroke-width="1"/>
  <text x="800" y="402" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="600">postgres__query</text>
</svg>
