<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1565c0"/><stop offset="100%" stop-color="#42a5f5"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1565c0"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f44336"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Python FastMCP: Lifespan y Contexto</text>

  <!-- Lifespan Section -->
  <rect x="40" y="80" width="340" height="360" rx="12" fill="#fff" stroke="#1565c0" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="80" width="340" height="36" rx="12" fill="#1565c0"/>
  <rect x="40" y="100" width="340" height="16" fill="#1565c0"/>
  <text x="210" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Lifespan Manager</text>

  <rect x="60" y="140" width="300" height="60" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="210" y="165" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="700">1. Server Start</text>
  <text x="210" y="185" text-anchor="middle" fill="#2e7d32" font-size="10">Inicializa DB, carga modelos en RAM</text>

  <line x1="210" y1="200" x2="210" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="250" width="300" height="60" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="210" y="275" text-anchor="middle" fill="#01579b" font-size="12" font-weight="700">2. Yield (Server Running)</text>
  <text x="210" y="295" text-anchor="middle" fill="#01579b" font-size="10">Procesa peticiones (tools, resources)</text>

  <line x1="210" y1="310" x2="210" y2="350" stroke="#f44336" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="360" width="300" height="60" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="210" y="385" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">3. Server Shutdown</text>
  <text x="210" y="405" text-anchor="middle" fill="#c62828" font-size="10">Cierra conexiones, limpia RAM</text>

  <!-- Context Section -->
  <rect x="420" y="80" width="340" height="360" rx="12" fill="#fff" stroke="#9c27b0" stroke-width="2" filter="url(#s)"/>
  <rect x="420" y="80" width="340" height="36" rx="12" fill="#9c27b0"/>
  <rect x="420" y="100" width="340" height="16" fill="#9c27b0"/>
  <text x="590" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Objeto Context (Inyectado)</text>

  <text x="590" y="145" text-anchor="middle" fill="#7b1fa2" font-size="11">Disponible en cualquier tool/resource:</text>
  <text x="450" y="170" fill="#282c34" font-size="11" font-family="Consolas,monospace">@mcp.tool()</text>
  <text x="450" y="190" fill="#282c34" font-size="11" font-family="Consolas,monospace">def my_tool(ctx: Context):</text>

  <rect x="440" y="210" width="300" height="200" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  
  <rect x="455" y="225" width="270" height="40" rx="4" fill="#fff"/>
  <text x="465" y="240" fill="#7b1fa2" font-size="10" font-weight="700">ctx.info</text>
  <text x="465" y="255" fill="#546e7a" font-size="10">Logging estructurado al host</text>

  <rect x="455" y="275" width="270" height="40" rx="4" fill="#fff"/>
  <text x="465" y="290" fill="#7b1fa2" font-size="10" font-weight="700">ctx.report_progress(50, 100)</text>
  <text x="465" y="305" fill="#546e7a" font-size="10">Reporte de progreso asíncrono</text>

  <rect x="455" y="325" width="270" height="40" rx="4" fill="#fff"/>
  <text x="465" y="340" fill="#7b1fa2" font-size="10" font-weight="700">ctx.session</text>
  <text x="465" y="355" fill="#546e7a" font-size="10">Acceso a la sesión (para sampling/roots)</text>
  
  <rect x="455" y="375" width="270" height="25" rx="4" fill="#fff"/>
  <text x="465" y="390" fill="#7b1fa2" font-size="10" font-weight="700">ctx.request_context</text>

</svg>
