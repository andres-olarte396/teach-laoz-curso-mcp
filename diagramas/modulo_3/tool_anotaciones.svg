<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
  </defs>
  <rect width="800" height="340" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Anotaciones de Herramientas MCP</text>

  <!-- readOnlyHint -->
  <rect x="30" y="80" width="230" height="230" rx="10" fill="#fff" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="80" width="230" height="30" rx="10" fill="#4caf50"/>
  <rect x="30" y="96" width="230" height="14" fill="#4caf50"/>
  <text x="145" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">readOnlyHint</text>
  <circle cx="60" cy="130" r="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="60" y="135" text-anchor="middle" fill="#4caf50" font-size="14">👁</text>
  <text x="145" y="135" text-anchor="middle" fill="#263238" font-size="11" font-weight="600">Solo lectura</text>
  <text x="145" y="165" text-anchor="middle" fill="#546e7a" font-size="10">No modifica el estado</text>
  <text x="145" y="183" text-anchor="middle" fill="#546e7a" font-size="10">del sistema externo.</text>
  <text x="50" y="215" fill="#2e7d32" font-size="10" font-weight="600">Ejemplo:</text>
  <text x="50" y="233" fill="#263238" font-size="10">get_weather</text>
  <text x="50" y="249" fill="#263238" font-size="10">list_users</text>
  <text x="50" y="265" fill="#263238" font-size="10">read_file</text>
  <rect x="50" y="278" width="190" height="22" rx="4" fill="#e8f5e9"/>
  <text x="145" y="294" text-anchor="middle" fill="#2e7d32" font-size="10">Host: ejecucion automatica</text>

  <!-- destructiveHint -->
  <rect x="285" y="80" width="230" height="230" rx="10" fill="#fff" stroke="#f44336" stroke-width="2" filter="url(#s)"/>
  <rect x="285" y="80" width="230" height="30" rx="10" fill="#f44336"/>
  <rect x="285" y="96" width="230" height="14" fill="#f44336"/>
  <text x="400" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">destructiveHint</text>
  <circle cx="315" cy="130" r="14" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="315" y="135" text-anchor="middle" fill="#f44336" font-size="14">⚠</text>
  <text x="400" y="135" text-anchor="middle" fill="#263238" font-size="11" font-weight="600">Destructiva</text>
  <text x="400" y="165" text-anchor="middle" fill="#546e7a" font-size="10">Modifica o elimina</text>
  <text x="400" y="183" text-anchor="middle" fill="#546e7a" font-size="10">datos del sistema.</text>
  <text x="305" y="215" fill="#c62828" font-size="10" font-weight="600">Ejemplo:</text>
  <text x="305" y="233" fill="#263238" font-size="10">delete_user</text>
  <text x="305" y="249" fill="#263238" font-size="10">drop_table</text>
  <text x="305" y="265" fill="#263238" font-size="10">send_email</text>
  <rect x="305" y="278" width="190" height="22" rx="4" fill="#ffebee"/>
  <text x="400" y="294" text-anchor="middle" fill="#c62828" font-size="10">Host: pedir confirmacion</text>

  <!-- openWorldHint -->
  <rect x="540" y="80" width="230" height="230" rx="10" fill="#fff" stroke="#ff9800" stroke-width="2" filter="url(#s)"/>
  <rect x="540" y="80" width="230" height="30" rx="10" fill="#ff9800"/>
  <rect x="540" y="96" width="230" height="14" fill="#ff9800"/>
  <text x="655" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">openWorldHint</text>
  <circle cx="570" cy="130" r="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="570" y="135" text-anchor="middle" fill="#ff9800" font-size="14">🌐</text>
  <text x="655" y="135" text-anchor="middle" fill="#263238" font-size="11" font-weight="600">Mundo abierto</text>
  <text x="655" y="165" text-anchor="middle" fill="#546e7a" font-size="10">Accede a servicios</text>
  <text x="655" y="183" text-anchor="middle" fill="#546e7a" font-size="10">externos (internet).</text>
  <text x="560" y="215" fill="#e65100" font-size="10" font-weight="600">Ejemplo:</text>
  <text x="560" y="233" fill="#263238" font-size="10">call_api</text>
  <text x="560" y="249" fill="#263238" font-size="10">web_search</text>
  <text x="560" y="265" fill="#263238" font-size="10">fetch_url</text>
  <rect x="560" y="278" width="190" height="22" rx="4" fill="#fff3e0"/>
  <text x="655" y="294" text-anchor="middle" fill="#e65100" font-size="10">Host: considerar privacidad</text>
</svg>
