<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
    <marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9c27b0"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ff9800"/></marker>
  </defs>
  <rect width="800" height="540" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Flujo Completo: De Usuario a Servidor MCP</text>

  <!-- Actors / Lifelines -->
  <rect x="30" y="75" width="100" height="28" rx="4" fill="#ff9800" filter="url(#s)"/><text x="80" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Usuario</text>
  <rect x="230" y="75" width="100" height="28" rx="4" fill="#9c27b0" filter="url(#s)"/><text x="280" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">LLM</text>
  <rect x="430" y="75" width="100" height="28" rx="4" fill="#0288d1" filter="url(#s)"/><text x="480" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Host/Client</text>
  <rect x="650" y="75" width="100" height="28" rx="4" fill="#4caf50" filter="url(#s)"/><text x="700" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Server MCP</text>
  
  <line x1="80" y1="103" x2="80" y2="510" stroke="#ff9800" stroke-width="2" stroke-dasharray="4"/>
  <line x1="280" y1="103" x2="280" y2="510" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4"/>
  <line x1="480" y1="103" x2="480" y2="510" stroke="#0288d1" stroke-width="2" stroke-dasharray="4"/>
  <line x1="700" y1="103" x2="700" y2="510" stroke="#4caf50" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 1: tools/list (Host -> Server) -->
  <line x1="480" y1="130" x2="690" y2="130" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="590" y="125" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">tools/list</text>
  
  <!-- Step 2: Return Tools (Server -> Host) -->
  <line x1="700" y1="160" x2="490" y2="160" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="590" y="155" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Lista: [get_weather, ...]</text>

  <!-- Step 3: User Question (User -> Host) -->
  <line x1="80" y1="200" x2="470" y2="200" stroke="#ff9800" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="280" y="195" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">"¿Cómo está el clima en Madrid?"</text>

  <!-- Step 4: Host calls LLM (Host -> LLM) -->
  <line x1="480" y1="240" x2="290" y2="240" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="385" y="235" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Envía Prompt + Tools</text>

  <!-- Step 5: LLM requests Tool Use (LLM -> Host) -->
  <line x1="280" y1="280" x2="470" y2="280" stroke="#9c27b0" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="385" y="275" text-anchor="middle" fill="#7b1fa2" font-size="11" font-weight="600">Tool Use: get_weather("Madrid")</text>

  <!-- Step 6: Host calls Server tool (Host -> Server) -->
  <line x1="480" y1="320" x2="690" y2="320" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="590" y="315" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">tools/call {city: "Madrid"}</text>

  <rect x="710" y="325" width="70" height="20" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="745" y="339" text-anchor="middle" fill="#2e7d32" font-size="9" font-weight="600">Ejecuta API</text>

  <!-- Step 7: Server returns result (Server -> Host) -->
  <line x1="700" y1="360" x2="490" y2="360" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="590" y="355" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Result: {temp: 22°C}</text>

  <!-- Step 8: Host sends result to LLM (Host -> LLM) -->
  <line x1="480" y1="400" x2="290" y2="400" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="385" y="395" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Contexto: Tool Result</text>

  <!-- Step 9: LLM generates final text (LLM -> Host) -->
  <line x1="280" y1="440" x2="470" y2="440" stroke="#9c27b0" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="385" y="435" text-anchor="middle" fill="#7b1fa2" font-size="11" font-weight="600">"En Madrid hace 22°C"</text>

  <!-- Step 10: Host replies to User (Host -> User) -->
  <line x1="480" y1="480" x2="90" y2="480" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="280" y="475" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">Respuesta mostrada al Usuario: "En Madrid hace 22°C"</text>
</svg>
