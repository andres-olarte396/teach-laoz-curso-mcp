<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546e7a"/></marker>
  </defs>
  <rect width="800" height="420" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Flujo Completo: tools/list → tools/call</text>

  <!-- Actors -->
  <rect x="40" y="75" width="100" height="28" rx="4" fill="#9c27b0"/><text x="90" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">LLM</text>
  <rect x="240" y="75" width="100" height="28" rx="4" fill="#0288d1"/><text x="290" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Host/Client</text>
  <rect x="520" y="75" width="100" height="28" rx="4" fill="#4caf50"/><text x="570" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Server MCP</text>
  <line x1="90" y1="103" x2="90" y2="400" stroke="#9c27b0" stroke-width="2"/>
  <line x1="290" y1="103" x2="290" y2="400" stroke="#0288d1" stroke-width="2"/>
  <line x1="570" y1="103" x2="570" y2="400" stroke="#4caf50" stroke-width="2"/>

  <!-- Step 1: tools/list -->
  <text x="660" y="130" fill="#263238" font-size="10" font-weight="600">FASE 1: Descubrimiento</text>
  <line x1="292" y1="140" x2="568" y2="140" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="360" y="128" width="140" height="20" rx="4" fill="#e1f5fe"/><text x="430" y="143" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">tools/list</text>
  <line x1="568" y1="165" x2="292" y2="165" stroke="#4caf50" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="153" width="170" height="20" rx="4" fill="#e8f5e9"/><text x="425" y="168" text-anchor="middle" fill="#2e7d32" font-size="9" font-weight="600">[get_weather, query_db...]</text>

  <!-- Step 2: User asks question -->
  <text x="660" y="200" fill="#263238" font-size="10" font-weight="600">FASE 2: Invocacion</text>
  <line x1="88" y1="210" x2="288" y2="210" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="190" y="207" text-anchor="middle" fill="#9c27b0" font-size="9">Usuario: "Clima en Madrid?"</text>

  <!-- Step 3: LLM selects tool -->
  <rect x="40" y="225" width="100" height="30" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="90" y="240" text-anchor="middle" fill="#7b1fa2" font-size="8">Selecciona:</text>
  <text x="90" y="250" text-anchor="middle" fill="#7b1fa2" font-size="8" font-weight="600">get_weather</text>

  <!-- Step 4: Host calls tool -->
  <line x1="292" y1="270" x2="568" y2="270" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="258" width="170" height="20" rx="4" fill="#e1f5fe"/><text x="425" y="273" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">tools/call {city:"Madrid"}</text>

  <!-- Step 5: Server executes -->
  <rect x="520" y="290" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="570" y="305" text-anchor="middle" fill="#2e7d32" font-size="8">Ejecuta logica</text>
  <text x="570" y="315" text-anchor="middle" fill="#2e7d32" font-size="8" font-weight="600">API clima...</text>

  <!-- Step 6: Server returns result -->
  <line x1="568" y1="335" x2="292" y2="335" stroke="#4caf50" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="323" width="170" height="20" rx="4" fill="#e8f5e9"/><text x="425" y="338" text-anchor="middle" fill="#2e7d32" font-size="9" font-weight="600">result: {temp: 22...}</text>

  <!-- Step 7: LLM generates response -->
  <line x1="288" y1="355" x2="92" y2="355" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="190" y="352" text-anchor="middle" fill="#0288d1" font-size="9">Pasa resultado al LLM</text>

  <rect x="40" y="365" width="100" height="24" rx="4" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="90" y="382" text-anchor="middle" fill="#7b1fa2" font-size="8" font-weight="600">Genera respuesta</text>

  <line x1="92" y1="395" x2="288" y2="395" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="190" y="392" text-anchor="middle" fill="#9c27b0" font-size="9">"En Madrid hace 22C..."</text>
</svg>
