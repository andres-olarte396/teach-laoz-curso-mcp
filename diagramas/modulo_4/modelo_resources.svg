<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546e7a"/></marker>
  </defs>
  <rect width="800" height="380" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Modelo de Resources MCP</text>

  <!-- URI -->
  <rect x="250" y="80" width="300" height="40" rx="8" fill="#263238" filter="url(#s)"/>
  <text x="400" y="105" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="600" font-family="Consolas,monospace">file:///users/doc.md</text>

  <line x1="400" y1="120" x2="400" y2="148" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Resource object -->
  <rect x="100" y="150" width="600" height="200" rx="12" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="100" y="150" width="600" height="32" rx="12" fill="#0288d1"/>
  <rect x="100" y="168" width="600" height="14" fill="#0288d1"/>
  <text x="400" y="172" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Resource</text>

  <!-- Fields -->
  <rect x="120" y="196" width="270" height="28" rx="4" fill="#e1f5fe"/><text x="130" y="215" fill="#01579b" font-size="11" font-weight="600">uri:</text><text x="160" y="215" fill="#263238" font-size="10" font-family="Consolas,monospace">"file:///users/doc.md"</text>
  <rect x="120" y="232" width="270" height="28" rx="4" fill="#e1f5fe"/><text x="130" y="251" fill="#01579b" font-size="11" font-weight="600">name:</text><text x="175" y="251" fill="#263238" font-size="10" font-family="Consolas,monospace">"Documentacion"</text>
  <rect x="120" y="268" width="270" height="28" rx="4" fill="#e1f5fe"/><text x="130" y="287" fill="#01579b" font-size="11" font-weight="600">mimeType:</text><text x="205" y="287" fill="#263238" font-size="10" font-family="Consolas,monospace">"text/markdown"</text>

  <!-- Content types -->
  <rect x="420" y="196" width="260" height="60" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="550" y="218" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Contenido TEXT</text>
  <text x="550" y="238" text-anchor="middle" fill="#263238" font-size="10">Texto legible: markdown, JSON,</text>
  <text x="550" y="252" text-anchor="middle" fill="#263238" font-size="10">codigo fuente, logs</text>

  <rect x="420" y="268" width="260" height="60" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="550" y="290" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">Contenido BLOB (base64)</text>
  <text x="550" y="310" text-anchor="middle" fill="#263238" font-size="10">Binario: imagenes, PDFs,</text>
  <text x="550" y="324" text-anchor="middle" fill="#263238" font-size="10">archivos compilados</text>
</svg>
