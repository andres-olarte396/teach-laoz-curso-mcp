<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546e7a"/></marker>
  </defs>
  <rect width="800" height="380" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Suscripciones a Resources MCP</text>

  <!-- Actors -->
  <rect x="100" y="75" width="120" height="28" rx="4" fill="#0288d1"/><text x="160" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Client</text>
  <rect x="520" y="75" width="120" height="28" rx="4" fill="#4caf50"/><text x="580" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Server</text>
  <line x1="160" y1="103" x2="160" y2="360" stroke="#0288d1" stroke-width="2"/>
  <line x1="580" y1="103" x2="580" y2="360" stroke="#4caf50" stroke-width="2"/>

  <!-- Step 1: Subscribe -->
  <line x1="162" y1="125" x2="578" y2="125" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="112" width="190" height="22" rx="4" fill="#e1f5fe"/><text x="375" y="128" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">resources/subscribe</text>
  <text x="660" y="128" fill="#546e7a" font-size="9">uri: "db://users/stats"</text>

  <!-- Step 2: ACK -->
  <line x1="578" y1="155" x2="162" y2="155" stroke="#4caf50" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="142" width="130" height="22" rx="4" fill="#e8f5e9"/><text x="375" y="158" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">result: {}</text>

  <!-- Time passes -->
  <rect x="340" y="175" width="70" height="20" rx="4" fill="#fff3e0"/>
  <text x="375" y="190" text-anchor="middle" fill="#e65100" font-size="9">tiempo...</text>

  <!-- Step 3: Data changes on server -->
  <rect x="620" y="200" width="150" height="30" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="695" y="220" text-anchor="middle" fill="#e65100" font-size="10">Datos cambian!</text>

  <!-- Step 4: Notification -->
  <line x1="578" y1="245" x2="162" y2="245" stroke="#ff9800" stroke-width="2" marker-end="url(#a)"/>
  <rect x="260" y="232" width="230" height="22" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="375" y="248" text-anchor="middle" fill="#e65100" font-size="10" font-weight="600">notifications/resources/updated</text>
  <text x="660" y="248" fill="#546e7a" font-size="9">uri: "db://users/stats"</text>

  <!-- Step 5: Client re-reads -->
  <line x1="162" y1="278" x2="578" y2="278" stroke="#0288d1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="290" y="265" width="170" height="22" rx="4" fill="#e1f5fe"/><text x="375" y="281" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">resources/read</text>

  <!-- Step 6: Fresh data -->
  <line x1="578" y1="308" x2="162" y2="308" stroke="#4caf50" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="295" width="190" height="22" rx="4" fill="#e8f5e9"/><text x="375" y="311" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">result: {datos frescos}</text>

  <!-- Unsubscribe -->
  <line x1="162" y1="340" x2="578" y2="340" stroke="#f44336" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <rect x="270" y="327" width="210" height="22" rx="4" fill="#ffebee"/><text x="375" y="343" text-anchor="middle" fill="#c62828" font-size="10">resources/unsubscribe (opcional)</text>
</svg>
