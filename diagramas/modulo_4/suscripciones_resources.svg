<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ff9800"/></marker>
    <marker id="m-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e53935"/></marker>
  </defs>
  <rect width="800" height="500" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Flujo de Suscripciones a Resources MCP</text>

  <!-- Actors / Lifelines -->
  <rect x="150" y="75" width="120" height="28" rx="4" fill="#0288d1" filter="url(#s)"/><text x="210" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Client</text>
  <rect x="530" y="75" width="120" height="28" rx="4" fill="#4caf50" filter="url(#s)"/><text x="590" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Server MCP</text>
  
  <line x1="210" y1="103" x2="210" y2="470" stroke="#0288d1" stroke-width="2" stroke-dasharray="4"/>
  <line x1="590" y1="103" x2="590" y2="470" stroke="#4caf50" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 1: Subscribe -->
  <line x1="210" y1="140" x2="580" y2="140" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="400" y="135" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">resources/subscribe { uri: "db://users/stats" }</text>

  <!-- Step 2: ACK -->
  <line x1="590" y1="180" x2="220" y2="180" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="400" y="175" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Result: {} (Suscripción Exitosa)</text>

  <!-- Time passes -->
  <rect x="360" y="210" width="80" height="24" rx="12" fill="#fff3e0" stroke="#ff9800"/>
  <text x="400" y="226" text-anchor="middle" fill="#e65100" font-size="10" font-weight="600">Pasa el tiempo...</text>

  <!-- Step 3: Data changes on server -->
  <rect x="610" y="240" width="160" height="26" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#s)"/>
  <text x="690" y="258" text-anchor="middle" fill="#e65100" font-size="11" font-weight="700">¡Los datos cambian!</text>

  <!-- Step 4: Notification -->
  <line x1="590" y1="290" x2="220" y2="290" stroke="#ff9800" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="400" y="285" text-anchor="middle" fill="#e65100" font-size="11" font-weight="700">notifications/resources/updated { uri: "db://users/stats" }</text>

  <!-- Step 5: Client re-reads -->
  <line x1="210" y1="340" x2="580" y2="340" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="400" y="335" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">resources/read { uri: "db://users/stats" }</text>

  <!-- Step 6: Fresh data -->
  <line x1="590" y1="380" x2="220" y2="380" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="400" y="375" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Result: { contents: [{ uri, text: "Nuevos Datos" }] }</text>

  <!-- Unsubscribe -->
  <line x1="210" y1="430" x2="580" y2="430" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#m-red)"/>
  <text x="400" y="425" text-anchor="middle" fill="#c62828" font-size="11" font-weight="600">resources/unsubscribe { uri: "db://users/stats" } (Opcional)</text>
</svg>
