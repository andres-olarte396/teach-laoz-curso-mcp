<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9c27b0"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Cliente Multi-Servidor (Aggregator)</text>

  <!-- LLM / User Layer -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="105" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="700">LLM (Claude/GPT)</text>
  <text x="400" y="125" text-anchor="middle" fill="#7b1fa2" font-size="11">Ve un solo catalogo unificado</text>

  <line x1="400" y1="140" x2="400" y2="180" stroke="#9c27b0" stroke-width="2.5" marker-end="url(#ap)"/>

  <!-- Aggregator Client -->
  <rect x="180" y="190" width="440" height="130" rx="12" fill="#fff" stroke="#0288d1" stroke-width="2.5" filter="url(#s)"/>
  <rect x="180" y="190" width="440" height="32" rx="12" fill="#0288d1"/>
  <rect x="180" y="210" width="440" height="12" fill="#0288d1"/>
  <text x="400" y="212" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Cliente MCP Aggregator (El "Router")</text>

  <rect x="200" y="235" width="400" height="70" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="400" y="255" text-anchor="middle" fill="#01579b" font-size="12" font-weight="600">Catalogo de Herramientas Fusionado</text>
  <text x="400" y="275" text-anchor="middle" fill="#01579b" font-size="11" font-family="Consolas,monospace">["fs_read", "fs_write", "github_pull", "db_query"]</text>
  <text x="400" y="295" text-anchor="middle" fill="#546e7a" font-size="10">El Cliente sabe a que servidor pertenece cada tool</text>

  <!-- Server 1 -->
  <line x1="300" y1="320" x2="160" y2="360" stroke="#0288d1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="370" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="140" y="395" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server 1: Local</text>
  <text x="140" y="415" text-anchor="middle" fill="#546e7a" font-size="10">Filesystem (stdio)</text>
  <rect x="80" y="425" width="120" height="20" rx="4" fill="#c8e6c9"/>
  <text x="140" y="438" text-anchor="middle" fill="#2e7d32" font-size="9">fs_read, fs_write</text>

  <!-- Server 2 -->
  <line x1="400" y1="320" x2="400" y2="360" stroke="#0288d1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="370" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="395" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server 2: Remoto</text>
  <text x="400" y="415" text-anchor="middle" fill="#546e7a" font-size="10">GitHub API (HTTP)</text>
  <rect x="340" y="425" width="120" height="20" rx="4" fill="#c8e6c9"/>
  <text x="400" y="438" text-anchor="middle" fill="#2e7d32" font-size="9">github_pull</text>

  <!-- Server 3 -->
  <line x1="500" y1="320" x2="640" y2="360" stroke="#0288d1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="370" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="660" y="395" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Server 3: Interno</text>
  <text x="660" y="415" text-anchor="middle" fill="#546e7a" font-size="10">DB Corporativa (SSE)</text>
  <rect x="600" y="425" width="120" height="20" rx="4" fill="#c8e6c9"/>
  <text x="660" y="438" text-anchor="middle" fill="#2e7d32" font-size="9">db_query</text>
</svg>
