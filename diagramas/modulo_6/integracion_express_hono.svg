<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#333333"/><stop offset="100%" stop-color="#555555"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Integracion Express / Hono con SSEServerTransport</text>

  <!-- Client -->
  <rect x="40" y="180" width="140" height="80" rx="10" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="180" width="140" height="24" rx="10" fill="#0288d1"/>
  <rect x="40" y="192" width="140" height="12" fill="#0288d1"/>
  <text x="110" y="196" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">MCP Client</text>
  <text x="110" y="230" text-anchor="middle" fill="#263238" font-size="12">Claude Desktop</text>
  <text x="110" y="245" text-anchor="middle" fill="#546e7a" font-size="10">u otro cliente</text>

  <!-- Express App -->
  <rect x="360" y="80" width="400" height="360" rx="12" fill="#fff" stroke="#333" stroke-width="2" filter="url(#s)"/>
  <rect x="360" y="80" width="400" height="36" rx="12" fill="#333"/>
  <rect x="360" y="100" width="400" height="16" fill="#333"/>
  <text x="560" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Aplicacion Express.js / Hono</text>

  <!-- Other Routes -->
  <rect x="380" y="130" width="360" height="40" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="155" text-anchor="middle" fill="#666" font-size="12" font-family="Consolas,monospace">app.get('/api/users', authMiddleware, ...)</text>

  <!-- MCP Server Instance -->
  <rect x="380" y="190" width="360" height="230" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="560" y="215" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">Instancia MCP Server</text>
  
  <rect x="400" y="230" width="320" height="80" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
  <text x="410" y="250" fill="#2e7d32" font-size="12" font-family="Consolas,monospace">app.get('/sse', async (req, res) => {</text>
  <text x="425" y="270" fill="#2e7d32" font-size="11" font-family="Consolas,monospace">transport = new SSEServerTransport(...) </text>
  <text x="425" y="290" fill="#2e7d32" font-size="11" font-family="Consolas,monospace">await mcpServer.connect(transport)</text>
  <text x="410" y="305" fill="#2e7d32" font-size="12" font-family="Consolas,monospace">})</text>

  <rect x="400" y="320" width="320" height="80" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="410" y="340" fill="#e65100" font-size="12" font-family="Consolas,monospace">app.post('/message', async (req, res) => {</text>
  <text x="425" y="360" fill="#e65100" font-size="11" font-family="Consolas,monospace">const sessionId = req.query.sessionId</text>
  <text x="425" y="380" fill="#e65100" font-size="11" font-family="Consolas,monospace">await transport.handlePostMessage(...) </text>
  <text x="410" y="395" fill="#e65100" font-size="12" font-family="Consolas,monospace">})</text>

  <!-- Arrows -->
  <line x1="180" y1="250" x2="390" y2="250" stroke="#4caf50" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="270" y="240" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">GET /sse (Abre canal eventos)</text>

  <line x1="180" y1="340" x2="390" y2="340" stroke="#ff9800" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="270" y="330" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">POST /message (Envia JSON-RPC)</text>

  <!-- Key benefit note -->
  <rect x="40" y="360" width="280" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="180" y="385" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">Ventaja Principal:</text>
  <text x="180" y="405" text-anchor="middle" fill="#e65100" font-size="10">El servidor MCP puede reutilizar la</text>
  <text x="180" y="418" text-anchor="middle" fill="#e65100" font-size="10">autenticación y middleware de Express</text>

</svg>
