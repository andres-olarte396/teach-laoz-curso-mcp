<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0277bd"/><stop offset="100%" stop-color="#0097a7"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0097a7"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f44336"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Escalabilidad: Stateless vs Stateful</text>

  <!-- STATELESS SECTION -->
  <rect x="40" y="80" width="340" height="360" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="80" width="340" height="36" rx="12" fill="#4caf50"/>
  <rect x="40" y="100" width="340" height="16" fill="#4caf50"/>
  <text x="210" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Stateless (Streamable HTTP)</text>

  <!-- Load Balancer -->
  <rect x="140" y="140" width="140" height="40" rx="6" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="210" y="165" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="700">Load Balancer</text>

  <!-- Server Instances -->
  <rect x="70" y="220" width="80" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="110" y="255" text-anchor="middle" fill="#1b5e20" font-size="14" font-weight="700">Inst A</text>

  <rect x="170" y="220" width="80" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="210" y="255" text-anchor="middle" fill="#1b5e20" font-size="14" font-weight="700">Inst B</text>

  <rect x="270" y="220" width="80" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="310" y="255" text-anchor="middle" fill="#1b5e20" font-size="14" font-weight="700">Inst C</text>

  <!-- Requests routing -->
  <path d="M 180 180 L 110 220" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M 210 180 L 210 220" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M 240 180 L 310 220" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>

  <text x="100" y="205" fill="#2e7d32" font-size="10">Req 1</text>
  <text x="220" y="205" fill="#2e7d32" font-size="10">Req 2</text>
  <text x="280" y="205" fill="#2e7d32" font-size="10">Req 3</text>

  <rect x="60" y="310" width="300" height="110" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="210" y="335" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">Escalamiento Horizontal Simple</text>
  <text x="80" y="360" fill="#2e7d32" font-size="11">✓ Cada Request es independiente.</text>
  <text x="80" y="380" fill="#2e7d32" font-size="11">✓ El Load Balancer puede rutear a cualquiera.</text>
  <text x="80" y="400" fill="#2e7d32" font-size="11">✓ Ideal para escalar a miles de usuarios.</text>

  <!-- STATEFUL SECTION -->
  <rect x="420" y="80" width="340" height="360" rx="12" fill="#ffebee" stroke="#f44336" stroke-width="2" filter="url(#s)"/>
  <rect x="420" y="80" width="340" height="36" rx="12" fill="#f44336"/>
  <rect x="420" y="100" width="340" height="16" fill="#f44336"/>
  <text x="590" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Stateful (SSE Transport)</text>

  <!-- Load Balancer -->
  <rect x="520" y="140" width="140" height="40" rx="6" fill="#fff" stroke="#f44336" stroke-width="2"/>
  <text x="590" y="165" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">Load Balancer</text>

  <!-- Server Instances -->
  <rect x="450" y="220" width="80" height="60" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="490" y="255" text-anchor="middle" fill="#b71c1c" font-size="14" font-weight="700">Inst A</text>

  <rect x="550" y="220" width="80" height="60" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="590" y="255" text-anchor="middle" fill="#b71c1c" font-size="14" font-weight="700">Inst B</text>

  <rect x="650" y="220" width="80" height="60" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="690" y="255" text-anchor="middle" fill="#b71c1c" font-size="14" font-weight="700">Inst C</text>

  <!-- Requests routing with sticky sessions -->
  <path d="M 590 180 L 490 220" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ac)"/>
  <path d="M 590 180 L 590 220" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ac)"/>
  
  <text x="455" y="195" fill="#c62828" font-size="9" font-weight="700">GET /sse (Sesión X)</text>
  <text x="525" y="215" fill="#c62828" font-size="9" font-weight="700">POST /msg?id=X</text>
  <text x="600" y="200" fill="#c62828" font-size="9">GET /sse (Y)</text>

  <rect x="440" y="310" width="300" height="110" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="590" y="335" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">Requiere "Sticky Sessions"</text>
  <text x="460" y="360" fill="#c62828" font-size="11">⚠ El POST debe ir a la MISMA instancia</text>
  <text x="460" y="375" fill="#c62828" font-size="11">   que abrió el GET /sse.</text>
  <text x="460" y="395" fill="#c62828" font-size="11">⚠ Memoria atada a la conexión abierta.</text>
  <text x="460" y="415" fill="#c62828" font-size="11">⚠ Difícil de escalar horizontalmente.</text>

</svg>
