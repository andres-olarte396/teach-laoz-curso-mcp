<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#263238"/><stop offset="100%" stop-color="#455a64"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9c27b0"/></marker>
    <marker id="m-gateway" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#512da8"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="1000" height="650" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1000" height="60" rx="12" fill="url(#h)"/>
  <rect x="0" y="30" width="1000" height="30" fill="url(#h)"/>
  <text x="500" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Arquitectura: Proyecto Integrador Final</text>

  <!-- USER LAYER -->
  <rect x="40" y="90" width="240" height="520" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="160" y="125" text-anchor="middle" fill="#01579b" font-size="18" font-weight="700">Capa de Usuario</text>

  <rect x="60" y="150" width="200" height="110" rx="6" fill="#fff" stroke="#0288d1" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" fill="#0288d1" font-size="15" font-weight="700">Host Web</text>
  <text x="160" y="195" text-anchor="middle" fill="#546e7a" font-size="13">Next.js React App</text>
  <rect x="80" y="210" width="160" height="35" rx="4" fill="#b3e5fc"/>
  <text x="160" y="233" text-anchor="middle" fill="#01579b" font-size="13" font-weight="600">UI Chat + Tools</text>

  <rect x="60" y="300" width="200" height="110" rx="6" fill="#fff" stroke="#0288d1" stroke-width="2"/>
  <text x="160" y="325" text-anchor="middle" fill="#0288d1" font-size="15" font-weight="700">Client Logic</text>
  <text x="160" y="345" text-anchor="middle" fill="#546e7a" font-size="13">TypeScript SDK</text>
  <rect x="80" y="360" width="160" height="35" rx="4" fill="#b3e5fc"/>
  <text x="160" y="383" text-anchor="middle" fill="#01579b" font-size="13" font-weight="600">@mcp/client</text>

  <rect x="60" y="450" width="200" height="110" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="2"/>
  <text x="160" y="475" text-anchor="middle" fill="#7b1fa2" font-size="15" font-weight="700">LLM Provider</text>
  <text x="160" y="495" text-anchor="middle" fill="#546e7a" font-size="13">Anthropic/OpenAI</text>
  <rect x="80" y="510" width="160" height="35" rx="4" fill="#e1bee7"/>
  <text x="160" y="533" text-anchor="middle" fill="#7b1fa2" font-size="13" font-weight="600">Tool Calling</text>

  <line x1="160" y1="260" x2="160" y2="300" stroke="#0288d1" stroke-width="3" marker-end="url(#m-blue)"/>
  <line x1="160" y1="410" x2="160" y2="450" stroke="#9c27b0" stroke-width="3" marker-end="url(#m-purple)"/>

  <!-- GATEWAY LAYER -->
  <line x1="260" y1="355" x2="380" y2="355" stroke="#0288d1" stroke-width="3" stroke-dasharray="6" marker-end="url(#m-blue)"/>
  <text x="320" y="345" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="700">SSE / HTTP</text>

  <rect x="360" y="90" width="260" height="520" rx="8" fill="#ede7f6" stroke="#512da8" stroke-width="2" filter="url(#s)"/>
  <text x="490" y="125" text-anchor="middle" fill="#311b92" font-size="18" font-weight="700">Capa de Entrada</text>

  <rect x="380" y="220" width="220" height="260" rx="6" fill="#fff" stroke="#512da8" stroke-width="2"/>
  <text x="490" y="250" text-anchor="middle" fill="#512da8" font-size="16" font-weight="700">MCP Gateway</text>
  <text x="490" y="270" text-anchor="middle" fill="#546e7a" font-size="13">Node.js / Express</text>
  
  <rect x="400" y="300" width="180" height="35" rx="4" fill="#ffcc80"/>
  <text x="490" y="323" text-anchor="middle" fill="#e65100" font-size="13" font-weight="600">OAuth 2.1 Auth</text>
  
  <rect x="400" y="350" width="180" height="35" rx="4" fill="#a5d6a7"/>
  <text x="490" y="373" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="600">Rate Limiting</text>

  <rect x="400" y="400" width="180" height="35" rx="4" fill="#ce93d8"/>
  <text x="490" y="423" text-anchor="middle" fill="#4a148c" font-size="13" font-weight="600">Aggregator Routing</text>

  <!-- SERVERS LAYER -->
  <line x1="600" y1="355" x2="720" y2="205" stroke="#512da8" stroke-width="3" marker-end="url(#m-gateway)"/>
  <line x1="600" y1="355" x2="720" y2="355" stroke="#512da8" stroke-width="3" marker-end="url(#m-gateway)"/>
  <line x1="600" y1="355" x2="720" y2="505" stroke="#512da8" stroke-width="3" marker-end="url(#m-gateway)"/>

  <rect x="700" y="90" width="260" height="520" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="830" y="125" text-anchor="middle" fill="#1b5e20" font-size="18" font-weight="700">Capa de Servicios (MCP)</text>

  <!-- Server 1 -->
  <rect x="720" y="150" width="220" height="110" rx="6" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="830" y="175" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Data Server (Python)</text>
  <text x="830" y="195" text-anchor="middle" fill="#546e7a" font-size="13">FastMCP</text>
  <rect x="740" y="210" width="180" height="35" rx="4" fill="#c8e6c9"/>
  <text x="830" y="233" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="600">DB Queries &amp; Resources</text>

  <!-- Server 2 -->
  <rect x="720" y="300" width="220" height="110" rx="6" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="830" y="325" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Compute Server (TS)</text>
  <text x="830" y="345" text-anchor="middle" fill="#546e7a" font-size="13">@mcp/sdk</text>
  <rect x="740" y="360" width="180" height="35" rx="4" fill="#c8e6c9"/>
  <text x="830" y="383" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="600">Tools: Calc, Analítica</text>

  <!-- Server 3 -->
  <rect x="720" y="450" width="220" height="110" rx="6" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="830" y="475" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="700">Comms Server (TS)</text>
  <text x="830" y="495" text-anchor="middle" fill="#546e7a" font-size="13">@mcp/sdk</text>
  <rect x="740" y="510" width="180" height="35" rx="4" fill="#c8e6c9"/>
  <text x="830" y="533" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="600">Prompts &amp; Integrations</text>
</svg>
