<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b71c1c"/><stop offset="100%" stop-color="#e53935"/></linearGradient>
    <marker id="m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ff9800"/></marker>
  </defs>
  <rect width="800" height="560" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Flujo OAuth 2.1 (PKCE) en MCP</text>

  <!-- Actors / Lifelines -->
  <rect x="90" y="75" width="120" height="40" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="150" y="100" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">MCP Client</text>
  
  <rect x="340" y="75" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="93" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Auth Server</text>
  <text x="400" y="108" text-anchor="middle" fill="#2e7d32" font-size="10">.well-known/oauth...</text>

  <rect x="590" y="75" width="120" height="40" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#s)"/>
  <text x="650" y="100" text-anchor="middle" fill="#e65100" font-size="14" font-weight="700">MCP Server</text>

  <line x1="150" y1="125" x2="150" y2="520" stroke="#0288d1" stroke-width="2" stroke-dasharray="4"/>
  <line x1="400" y1="125" x2="400" y2="520" stroke="#4caf50" stroke-width="2" stroke-dasharray="4"/>
  <line x1="650" y1="125" x2="650" y2="520" stroke="#ff9800" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 1: Discovery (Client -> MCP Server) -->
  <line x1="150" y1="150" x2="640" y2="150" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)" stroke-dasharray="4"/>
  <text x="400" y="145" text-anchor="middle" fill="#01579b" font-size="12" font-weight="600">1. GET /sse (Falla -> 401 Unauthorized + Header con Issuer URL)</text>

  <!-- Step 2: Auth Request (Client -> Auth Server) -->
  <line x1="150" y1="200" x2="390" y2="200" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="275" y="195" text-anchor="middle" fill="#01579b" font-size="12" font-weight="600">2. Request Auth (PKCE code_challenge)</text>

  <!-- Step 3: User Consent -->
  <rect x="340" y="225" width="120" height="26" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="400" y="243" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="700">3. Usuario hace Login</text>

  <!-- Step 4: Auth Code (Auth Server -> Client) -->
  <line x1="400" y1="290" x2="160" y2="290" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="275" y="285" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="600">4. Redirect con Authorization Code</text>

  <!-- Step 5: Token Exchange (Client -> Auth Server) -->
  <line x1="150" y1="340" x2="390" y2="340" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="275" y="335" text-anchor="middle" fill="#01579b" font-size="12" font-weight="600">5. POST /token (Envía code_verifier)</text>

  <!-- Step 6: Return Token (Auth Server -> Client) -->
  <line x1="400" y1="390" x2="160" y2="390" stroke="#4caf50" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="275" y="385" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="600">6. Retorna Access Token (Bearer)</text>

  <!-- Step 7: Access Resource (Client -> MCP Server) -->
  <line x1="150" y1="440" x2="640" y2="440" stroke="#0288d1" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="400" y="435" text-anchor="middle" fill="#01579b" font-size="12" font-weight="600">7. GET /sse (Incluye Header: Auth Bearer)</text>

  <!-- Step 8: Connection OK (MCP Server -> Client) -->
  <line x1="650" y1="490" x2="160" y2="490" stroke="#ff9800" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="400" y="485" text-anchor="middle" fill="#e65100" font-size="12" font-weight="600">8. Conexión Establecida (200 OK)</text>

</svg>
