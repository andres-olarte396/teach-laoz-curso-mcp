<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b71c1c"/><stop offset="100%" stop-color="#e53935"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f44336"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Flujo OAuth 2.1 en MCP</text>

  <!-- Actors -->
  <rect x="50" y="100" width="140" height="60" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="120" y="135" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">MCP Client</text>
  
  <rect x="330" y="100" width="140" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="125" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Auth Server</text>
  <text x="400" y="145" text-anchor="middle" fill="#2e7d32" font-size="11">.well-known/oauth-...</text>

  <rect x="610" y="100" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#s)"/>
  <text x="680" y="135" text-anchor="middle" fill="#e65100" font-size="14" font-weight="700">MCP Server</text>

  <!-- Vertical lines -->
  <line x1="120" y1="160" x2="120" y2="440" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="400" y1="160" x2="400" y2="440" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="680" y1="160" x2="680" y2="440" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Flow Steps -->
  <!-- 1. Discovery -->
  <line x1="120" y1="190" x2="680" y2="190" stroke="#0288d1" stroke-width="2" marker-end="url(#a)" stroke-dasharray="4"/>
  <rect x="300" y="180" width="200" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="400" y="194" text-anchor="middle" fill="#333" font-size="10">1. GET /sse (Falla -> 401 + Issuer)</text>

  <!-- 2. Auth Request -->
  <line x1="120" y1="230" x2="400" y2="230" stroke="#0288d1" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="160" y="220" width="200" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="260" y="234" text-anchor="middle" fill="#333" font-size="10">2. Request Auth (PKCE code_challenge)</text>

  <!-- 3. User Consent -->
  <rect x="350" y="250" width="100" height="30" rx="4" fill="#e3f2fd" stroke="#0288d1"/>
  <text x="400" y="269" text-anchor="middle" fill="#01579b" font-size="10">Usuario da Login</text>

  <!-- 4. Auth Code -->
  <line x1="400" y1="300" x2="120" y2="300" stroke="#4caf50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="160" y="290" width="200" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="260" y="304" text-anchor="middle" fill="#333" font-size="10">3. Redirect con Authorization Code</text>

  <!-- 5. Token Exchange -->
  <line x1="120" y1="340" x2="400" y2="340" stroke="#0288d1" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="400" y1="360" x2="120" y2="360" stroke="#4caf50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="160" y="330" width="200" height="40" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="260" y="345" text-anchor="middle" fill="#333" font-size="10">4. POST /token (code_verifier)</text>
  <text x="260" y="360" text-anchor="middle" fill="#333" font-size="10">Return Access Token (Bearer)</text>

  <!-- 6. Access Resource -->
  <line x1="120" y1="400" x2="680" y2="400" stroke="#0288d1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="390" width="200" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="400" y="404" text-anchor="middle" fill="#333" font-size="10">5. GET /sse (Header: Auth Bearer)</text>

  <line x1="680" y1="420" x2="120" y2="420" stroke="#ff9800" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="410" width="200" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="400" y="424" text-anchor="middle" fill="#333" font-size="10">6. Conexión Establecida (200 OK)</text>

</svg>
