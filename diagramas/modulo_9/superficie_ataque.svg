<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b71c1c"/><stop offset="100%" stop-color="#e53935"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f44336"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#fffafafa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Superficie de Ataque MCP</text>

  <!-- Central Components -->
  <rect x="100" y="180" width="160" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="180" y="215" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">LLM (Host)</text>
  <text x="180" y="235" text-anchor="middle" fill="#01579b" font-size="11">Ejecutor de prompts</text>

  <rect x="320" y="180" width="160" height="80" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="400" y="215" text-anchor="middle" fill="#01579b" font-size="14" font-weight="700">MCP Client</text>
  <text x="400" y="235" text-anchor="middle" fill="#01579b" font-size="11">Agente o Desktop</text>

  <rect x="540" y="180" width="160" height="80" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="620" y="215" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">MCP Server</text>
  <text x="620" y="235" text-anchor="middle" fill="#2e7d32" font-size="11">Proveedor de Tools</text>

  <!-- Links -->
  <line x1="260" y1="220" x2="320" y2="220" stroke="#0288d1" stroke-width="2"/>
  <line x1="480" y1="220" x2="540" y2="220" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4"/>

  <!-- Threat 1: Prompt Injection / Exfiltration -->
  <rect x="100" y="80" width="220" height="60" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="210" y="105" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">1. Prompt Injection (Indirecto)</text>
  <text x="210" y="125" text-anchor="middle" fill="#c62828" font-size="10">El servidor envía datos maliciosos que</text>
  <text x="210" y="138" text-anchor="middle" fill="#c62828" font-size="10">manipulan el comportamiento del LLM</text>
  <path d="M 540 180 Q 210 140 180 180" fill="none" stroke="#f44336" stroke-width="2" marker-end="url(#a)"/>

  <!-- Threat 2: Client Hijacking / DNS Rebinding -->
  <rect x="290" y="290" width="220" height="60" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="400" y="315" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">2. DNS Rebinding</text>
  <text x="400" y="335" text-anchor="middle" fill="#c62828" font-size="10">Páginas web atacando servidores MCP</text>
  <text x="400" y="348" text-anchor="middle" fill="#c62828" font-size="10">locales vía fetch() en el navegador</text>
  <line x1="400" y1="290" x2="400" y2="260" stroke="#f44336" stroke-width="2" marker-end="url(#a)"/>

  <!-- Threat 3: Server Exploitation -->
  <rect x="540" y="80" width="220" height="60" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="650" y="105" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">3. Ejecución de Código (RCE)</text>
  <text x="650" y="125" text-anchor="middle" fill="#c62828" font-size="10">El LLM envía comandos maliciosos a</text>
  <text x="650" y="138" text-anchor="middle" fill="#c62828" font-size="10">tools como execute_command o bash</text>
  <path d="M 360 180 Q 500 140 580 180" fill="none" stroke="#f44336" stroke-width="2" marker-end="url(#a)"/>

  <!-- Threat 4: Data Exfiltration / MITM -->
  <rect x="520" y="290" width="240" height="60" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="640" y="315" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">4. MITM y Credenciales</text>
  <text x="640" y="335" text-anchor="middle" fill="#c62828" font-size="10">Interceptación del tráfico no encriptado</text>
  <text x="640" y="348" text-anchor="middle" fill="#c62828" font-size="10">o robo de tokens Bearer en transporte HTTP</text>
  <line x1="640" y1="290" x2="520" y2="230" stroke="#f44336" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="420" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">Regla de Oro: Confianza Cero (Zero Trust)</text>
  <text x="400" y="440" text-anchor="middle" fill="#d32f2f" font-size="12">El LLM no confía en el Servidor, el Servidor no confía en el LLM.</text>
</svg>
