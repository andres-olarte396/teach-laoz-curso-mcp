<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Problema N×M vs Solucion MCP (N+M)</text>

  <!-- LEFT: N×M Problem -->
  <text x="200" y="86" text-anchor="middle" fill="#f44336" font-size="16" font-weight="700">Sin MCP: N × M integraciones</text>
  <!-- AI Apps -->
  <rect x="30" y="105" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="80" y="126" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Claude</text>
  <rect x="30" y="145" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="80" y="166" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">ChatGPT</text>
  <rect x="30" y="185" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="80" y="206" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Cursor IDE</text>
  <!-- Data Sources -->
  <rect x="260" y="105" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="310" y="126" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Postgres</text>
  <rect x="260" y="145" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="310" y="166" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Google Drive</text>
  <rect x="260" y="185" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="310" y="206" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Slack</text>
  <!-- 9 lines (N×M) -->
  <line x1="130" y1="121" x2="260" y2="121" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="121" x2="260" y2="161" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="121" x2="260" y2="201" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="161" x2="260" y2="121" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="161" x2="260" y2="161" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="161" x2="260" y2="201" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="201" x2="260" y2="121" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="201" x2="260" y2="161" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="201" x2="260" y2="201" stroke="#f44336" stroke-width="1" opacity="0.6"/>
  <rect x="140" y="147" width="110" height="28" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="195" y="166" text-anchor="middle" fill="#c62828" font-size="11" font-weight="700">9 conexiones</text>

  <!-- RIGHT: N+M Solution -->
  <text x="600" y="86" text-anchor="middle" fill="#4caf50" font-size="16" font-weight="700">Con MCP: N + M integraciones</text>
  <!-- AI Apps -->
  <rect x="430" y="105" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="480" y="126" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Claude</text>
  <rect x="430" y="145" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="480" y="166" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">ChatGPT</text>
  <rect x="430" y="185" width="100" height="32" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="480" y="206" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Cursor IDE</text>
  <!-- MCP Hub -->
  <rect x="570" y="120" width="80" height="90" rx="40" fill="#0288d1" filter="url(#s)"/>
  <text x="610" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">MCP</text>
  <text x="610" y="178" text-anchor="middle" fill="#e1f5fe" font-size="9">Protocolo</text>
  <!-- Data Sources -->
  <rect x="690" y="105" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="740" y="126" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Postgres</text>
  <rect x="690" y="145" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="740" y="166" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Google Drive</text>
  <rect x="690" y="185" width="100" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/><text x="740" y="206" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Slack</text>
  <!-- 3+3 lines -->
  <line x1="530" y1="121" x2="570" y2="150" stroke="#0288d1" stroke-width="2"/>
  <line x1="530" y1="161" x2="570" y2="160" stroke="#0288d1" stroke-width="2"/>
  <line x1="530" y1="201" x2="570" y2="170" stroke="#0288d1" stroke-width="2"/>
  <line x1="650" y1="150" x2="690" y2="121" stroke="#4caf50" stroke-width="2"/>
  <line x1="650" y1="160" x2="690" y2="161" stroke="#4caf50" stroke-width="2"/>
  <line x1="650" y1="170" x2="690" y2="201" stroke="#4caf50" stroke-width="2"/>

  <!-- USB Analogy -->
  <rect x="40" y="260" width="720" height="220" rx="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5" filter="url(#s)"/>
  <rect x="40" y="260" width="720" height="34" rx="12" fill="#263238"/>
  <rect x="40" y="278" width="720" height="16" fill="#263238"/>
  <text x="400" y="283" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="600">Analogia USB — MCP es el "USB de la IA"</text>
  <!-- Before USB -->
  <text x="200" y="320" text-anchor="middle" fill="#f44336" font-size="13" font-weight="600">Antes de USB</text>
  <rect x="80" y="335" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="120" y="354" text-anchor="middle" fill="#c62828" font-size="9">Puerto Serie</text>
  <rect x="170" y="335" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="210" y="354" text-anchor="middle" fill="#c62828" font-size="9">Puerto Paralelo</text>
  <rect x="260" y="335" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="300" y="354" text-anchor="middle" fill="#c62828" font-size="9">PS/2</text>
  <rect x="80" y="375" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="120" y="394" text-anchor="middle" fill="#c62828" font-size="9">FireWire</text>
  <rect x="170" y="375" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="210" y="394" text-anchor="middle" fill="#c62828" font-size="9">SCSI</text>
  <rect x="260" y="375" width="80" height="28" rx="4" fill="#ffcdd2"/><text x="300" y="394" text-anchor="middle" fill="#c62828" font-size="9">Propietario</text>
  <text x="200" y="430" text-anchor="middle" fill="#c62828" font-size="11">Cada dispositivo = puerto diferente</text>
  <text x="200" y="448" text-anchor="middle" fill="#c62828" font-size="16" font-weight="700">N × M</text>
  <!-- After USB -->
  <text x="580" y="320" text-anchor="middle" fill="#4caf50" font-size="13" font-weight="600">Con USB / MCP</text>
  <rect x="500" y="335" width="180" height="70" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="590" y="365" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="700">1 Estandar</text>
  <text x="590" y="390" text-anchor="middle" fill="#2e7d32" font-size="12">USB / MCP</text>
  <text x="580" y="430" text-anchor="middle" fill="#2e7d32" font-size="11">Cualquier dispositivo = 1 puerto</text>
  <text x="580" y="448" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="700">N + M</text>
</svg>
