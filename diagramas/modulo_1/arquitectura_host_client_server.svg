<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#546e7a"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Arquitectura MCP: Host, Client y Server</text>

  <!-- User -->
  <circle cx="100" cy="140" r="28" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="100" y="136" text-anchor="middle" fill="#01579b" font-size="18">👤</text>
  <text x="100" y="152" text-anchor="middle" fill="#01579b" font-size="9" font-weight="600">Usuario</text>

  <!-- HOST -->
  <rect x="180" y="80" width="300" height="280" rx="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="2.5" filter="url(#s)"/>
  <rect x="180" y="80" width="300" height="36" rx="14" fill="#01579b"/>
  <rect x="180" y="100" width="300" height="16" fill="#01579b"/>
  <text x="330" y="103" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">HOST (Aplicacion de IA)</text>
  <text x="330" y="140" text-anchor="middle" fill="#01579b" font-size="11">Claude Desktop / Cursor / VS Code</text>
  <!-- LLM inside host -->
  <rect x="210" y="155" width="240" height="55" rx="8" fill="#fff" stroke="#9c27b0" stroke-width="2" filter="url(#s)"/>
  <text x="330" y="178" text-anchor="middle" fill="#9c27b0" font-size="13" font-weight="600">LLM (Claude 3.5)</text>
  <text x="330" y="198" text-anchor="middle" fill="#546e7a" font-size="10">Genera texto y decide usar herramientas</text>
  <!-- Client inside host -->
  <rect x="210" y="225" width="240" height="55" rx="8" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <text x="330" y="248" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="600">CLIENT MCP</text>
  <text x="330" y="268" text-anchor="middle" fill="#546e7a" font-size="10">Envia/recibe mensajes JSON-RPC</text>
  <!-- UI inside host -->
  <rect x="210" y="295" width="240" height="46" rx="8" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="330" y="318" text-anchor="middle" fill="#ff9800" font-size="11" font-weight="600">Interfaz de Usuario (UI)</text>
  <text x="330" y="334" text-anchor="middle" fill="#546e7a" font-size="9">Muestra resultados al usuario</text>

  <!-- Arrows user to host -->
  <line x1="128" y1="140" x2="178" y2="310" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="140" y="230" fill="#546e7a" font-size="9" transform="rotate(-72,140,230)">Interactua</text>

  <!-- Arrows LLM to Client -->
  <line x1="330" y1="210" x2="330" y2="223" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- SERVER(s) -->
  <rect x="550" y="90" width="220" height="150" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2.5" filter="url(#s)"/>
  <rect x="550" y="90" width="220" height="34" rx="12" fill="#4caf50"/>
  <rect x="550" y="108" width="220" height="16" fill="#4caf50"/>
  <text x="660" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">SERVER MCP</text>
  <text x="660" y="150" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Expone capacidades:</text>
  <rect x="570" y="162" width="60" height="22" rx="4" fill="#c8e6c9"/><text x="600" y="177" text-anchor="middle" fill="#2e7d32" font-size="10">Tools</text>
  <rect x="640" y="162" width="70" height="22" rx="4" fill="#c8e6c9"/><text x="675" y="177" text-anchor="middle" fill="#2e7d32" font-size="10">Resources</text>
  <rect x="570" y="192" width="60" height="22" rx="4" fill="#c8e6c9"/><text x="600" y="207" text-anchor="middle" fill="#2e7d32" font-size="10">Prompts</text>
  <rect x="640" y="192" width="70" height="22" rx="4" fill="#c8e6c9"/><text x="675" y="207" text-anchor="middle" fill="#2e7d32" font-size="10">Logging</text>

  <!-- Protocol arrow -->
  <line x1="452" y1="252" x2="548" y2="170" stroke="#0288d1" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="460" y="195" width="100" height="26" rx="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
  <text x="510" y="213" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">JSON-RPC 2.0</text>

  <!-- Multiple servers -->
  <rect x="550" y="270" width="220" height="60" rx="12" fill="#fff" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="660" y="296" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="600">Server MCP #2</text>
  <text x="660" y="314" text-anchor="middle" fill="#546e7a" font-size="10">mcp-server-git</text>
  <rect x="550" y="340" width="220" height="60" rx="12" fill="#fff" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="660" y="366" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="600">Server MCP #3</text>
  <text x="660" y="384" text-anchor="middle" fill="#546e7a" font-size="10">mcp-server-postgres</text>

  <!-- Note -->
  <rect x="40" y="400" width="440" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="260" y="422" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">Relacion 1:1 — Cada Client mantiene una conexion</text>
  <text x="260" y="442" text-anchor="middle" fill="#e65100" font-size="11">con un solo Server. El Host puede tener multiples Clients.</text>
</svg>
