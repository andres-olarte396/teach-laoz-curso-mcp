<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
  </defs>
  <rect width="800" height="440" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Streamable HTTP — Un Solo Endpoint</text>

  <!-- Single endpoint -->
  <rect x="250" y="80" width="300" height="44" rx="10" fill="#0288d1" filter="url(#s)"/>
  <text x="400" y="107" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">POST /mcp</text>

  <!-- Three modes -->
  <line x1="330" y1="124" x2="140" y2="165" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="400" y1="124" x2="400" y2="165" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="470" y1="124" x2="660" y2="165" stroke="#546e7a" stroke-width="1.5"/>

  <!-- Mode 1: POST regular -->
  <rect x="30" y="165" width="220" height="110" rx="10" fill="#fff" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="165" width="220" height="28" rx="10" fill="#4caf50"/>
  <rect x="30" y="179" width="220" height="14" fill="#4caf50"/>
  <text x="140" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Modo 1: POST Simple</text>
  <text x="140" y="212" text-anchor="middle" fill="#263238" font-size="10">Client envia JSON-RPC</text>
  <text x="140" y="228" text-anchor="middle" fill="#263238" font-size="10">Server responde con JSON</text>
  <text x="140" y="248" text-anchor="middle" fill="#546e7a" font-size="10" font-style="italic">Content-Type: application/json</text>
  <text x="140" y="266" text-anchor="middle" fill="#4caf50" font-size="10" font-weight="600">Para: requests simples</text>

  <!-- Mode 2: POST + SSE -->
  <rect x="280" y="165" width="240" height="110" rx="10" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="280" y="165" width="240" height="28" rx="10" fill="#0288d1"/>
  <rect x="280" y="179" width="240" height="14" fill="#0288d1"/>
  <text x="400" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Modo 2: POST + SSE Stream</text>
  <text x="400" y="212" text-anchor="middle" fill="#263238" font-size="10">Client envia JSON-RPC</text>
  <text x="400" y="228" text-anchor="middle" fill="#263238" font-size="10">Server abre stream SSE</text>
  <text x="400" y="248" text-anchor="middle" fill="#546e7a" font-size="10" font-style="italic">Content-Type: text/event-stream</text>
  <text x="400" y="266" text-anchor="middle" fill="#0288d1" font-size="10" font-weight="600">Para: operaciones largas</text>

  <!-- Mode 3: GET -->
  <rect x="550" y="165" width="220" height="110" rx="10" fill="#fff" stroke="#ff9800" stroke-width="2" filter="url(#s)"/>
  <rect x="550" y="165" width="220" height="28" rx="10" fill="#ff9800"/>
  <rect x="550" y="179" width="220" height="14" fill="#ff9800"/>
  <text x="660" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Modo 3: GET Stream</text>
  <text x="660" y="212" text-anchor="middle" fill="#263238" font-size="10">Client abre stream SSE</text>
  <text x="660" y="228" text-anchor="middle" fill="#263238" font-size="10">Server envia notificaciones</text>
  <text x="660" y="248" text-anchor="middle" fill="#546e7a" font-size="10" font-style="italic">Server-initiated messages</text>
  <text x="660" y="266" text-anchor="middle" fill="#ff9800" font-size="10" font-weight="600">Para: push notifications</text>

  <!-- Session management -->
  <rect x="60" y="310" width="680" height="110" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1.5" filter="url(#s)"/>
  <rect x="60" y="310" width="680" height="28" rx="10" fill="#263238"/>
  <rect x="60" y="324" width="680" height="14" fill="#263238"/>
  <text x="400" y="330" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="600">Gestion de Sesiones</text>
  <text x="100" y="360" fill="#263238" font-size="11" font-weight="600">Header:</text>
  <rect x="160" y="346" width="230" height="22" rx="4" fill="#e1f5fe"/>
  <text x="275" y="362" text-anchor="middle" fill="#01579b" font-size="10" font-family="Consolas,monospace">Mcp-Session-Id: abc123...</text>
  <text x="100" y="388" fill="#263238" font-size="11" font-weight="600">Resumability:</text>
  <rect x="200" y="374" width="230" height="22" rx="4" fill="#e1f5fe"/>
  <text x="315" y="390" text-anchor="middle" fill="#01579b" font-size="10" font-family="Consolas,monospace">Last-Event-ID: evt_42</text>
  <text x="500" y="362" fill="#546e7a" font-size="10">El servidor asigna el ID de sesion</text>
  <text x="500" y="380" fill="#546e7a" font-size="10">tras initialize. El cliente lo incluye</text>
  <text x="500" y="398" fill="#546e7a" font-size="10">en TODOS los requests siguientes.</text>
</svg>
