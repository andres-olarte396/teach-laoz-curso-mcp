<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="400" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Transporte SSE — Dos Endpoints HTTP</text>

  <!-- Client -->
  <rect x="40" y="90" width="200" height="80" rx="10" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="90" width="200" height="30" rx="10" fill="#0288d1"/>
  <rect x="40" y="106" width="200" height="14" fill="#0288d1"/>
  <text x="140" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">MCP Client</text>
  <text x="140" y="140" text-anchor="middle" fill="#263238" font-size="11">Envia y recibe</text>
  <text x="140" y="158" text-anchor="middle" fill="#263238" font-size="11">mensajes JSON-RPC</text>

  <!-- Server -->
  <rect x="560" y="90" width="200" height="80" rx="10" fill="#fff" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="560" y="90" width="200" height="30" rx="10" fill="#4caf50"/>
  <rect x="560" y="106" width="200" height="14" fill="#4caf50"/>
  <text x="660" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">MCP Server</text>
  <text x="660" y="140" text-anchor="middle" fill="#263238" font-size="11">Servidor HTTP</text>
  <text x="660" y="158" text-anchor="middle" fill="#263238" font-size="11">con 2 endpoints</text>

  <!-- Endpoint 1: SSE (server→client) -->
  <rect x="60" y="200" width="680" height="80" rx="10" fill="#fff" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="60" y="200" width="680" height="28" rx="10" fill="#4caf50"/>
  <rect x="60" y="214" width="680" height="14" fill="#4caf50"/>
  <text x="400" y="220" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Canal 1: GET /sse — Server-Sent Events (Server → Client)</text>
  <text x="400" y="252" text-anchor="middle" fill="#263238" font-size="11">Conexion persistente. El servidor envia eventos al cliente en tiempo real.</text>
  <text x="400" y="270" text-anchor="middle" fill="#546e7a" font-size="10">Respuestas JSON-RPC, notificaciones, logs</text>
  <line x1="555" y1="238" x2="245" y2="238" stroke="#4caf50" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Endpoint 2: POST (client→server) -->
  <rect x="60" y="300" width="680" height="80" rx="10" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="60" y="300" width="680" height="28" rx="10" fill="#0288d1"/>
  <rect x="60" y="314" width="680" height="14" fill="#0288d1"/>
  <text x="400" y="320" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Canal 2: POST /message — HTTP POST (Client → Server)</text>
  <text x="400" y="352" text-anchor="middle" fill="#263238" font-size="11">Cada solicitud es un POST individual con el mensaje JSON-RPC en el body.</text>
  <text x="400" y="370" text-anchor="middle" fill="#546e7a" font-size="10">initialize, tools/call, resources/read, prompts/get</text>
  <line x1="245" y1="338" x2="555" y2="338" stroke="#0288d1" stroke-width="2" marker-end="url(#a)"/>
</svg>
