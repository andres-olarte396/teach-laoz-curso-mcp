<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="aR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0288d1"/></marker>
    <marker id="aL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0,0 3.5,10 7" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Ciclo HTTP Request — Response</text>
  <!-- Client -->
  <rect x="40" y="90" width="200" height="110" rx="12" fill="#fff" stroke="#0288d1" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="90" width="200" height="34" rx="12" fill="#0288d1"/>
  <rect x="40" y="106" width="200" height="18" fill="#0288d1"/>
  <text x="140" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Cliente</text>
  <text x="140" y="145" text-anchor="middle" fill="#263238" font-size="11">Navegador / App</text>
  <text x="140" y="165" text-anchor="middle" fill="#263238" font-size="11">Cliente MCP / curl</text>
  <!-- Server -->
  <rect x="560" y="90" width="200" height="110" rx="12" fill="#fff" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <rect x="560" y="90" width="200" height="34" rx="12" fill="#4caf50"/>
  <rect x="560" y="106" width="200" height="18" fill="#4caf50"/>
  <text x="660" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Servidor</text>
  <text x="660" y="145" text-anchor="middle" fill="#263238" font-size="11">Servidor HTTP / MCP</text>
  <text x="660" y="165" text-anchor="middle" fill="#263238" font-size="11">API REST</text>
  <!-- Arrows -->
  <line x1="240" y1="125" x2="555" y2="125" stroke="#0288d1" stroke-width="2.5" marker-end="url(#aR)"/>
  <rect x="320" y="112" width="160" height="28" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
  <text x="400" y="131" text-anchor="middle" fill="#01579b" font-size="11" font-weight="600">REQUEST</text>
  <line x1="555" y1="175" x2="240" y2="175" stroke="#4caf50" stroke-width="2.5" marker-end="url(#aL)"/>
  <rect x="320" y="162" width="160" height="28" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="400" y="181" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">RESPONSE</text>
  <!-- Request -->
  <rect x="40" y="230" width="350" height="230" rx="10" fill="#fff" stroke="#0288d1" stroke-width="1.5" filter="url(#s)"/>
  <rect x="40" y="230" width="350" height="30" rx="10" fill="#0288d1"/>
  <rect x="40" y="246" width="350" height="14" fill="#0288d1"/>
  <text x="215" y="251" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Request (Peticion)</text>
  <text x="60" y="282" fill="#01579b" font-size="12" font-weight="700">Linea de peticion:</text>
  <text x="60" y="300" fill="#263238" font-size="11" font-family="Consolas,monospace">POST /api/tools/call HTTP/1.1</text>
  <text x="60" y="326" fill="#01579b" font-size="12" font-weight="700">Headers:</text>
  <text x="60" y="344" fill="#263238" font-size="11" font-family="Consolas,monospace">Content-Type: application/json</text>
  <text x="60" y="360" fill="#263238" font-size="11" font-family="Consolas,monospace">Authorization: Bearer &lt;token&gt;</text>
  <text x="60" y="376" fill="#263238" font-size="11" font-family="Consolas,monospace">Accept: application/json</text>
  <text x="60" y="402" fill="#01579b" font-size="12" font-weight="700">Body (JSON):</text>
  <text x="60" y="420" fill="#263238" font-size="11" font-family="Consolas,monospace">{"method":"tools/call",...}</text>
  <!-- Response -->
  <rect x="410" y="230" width="350" height="230" rx="10" fill="#fff" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/>
  <rect x="410" y="230" width="350" height="30" rx="10" fill="#4caf50"/>
  <rect x="410" y="246" width="350" height="14" fill="#4caf50"/>
  <text x="585" y="251" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Response (Respuesta)</text>
  <text x="430" y="282" fill="#2e7d32" font-size="12" font-weight="700">Linea de estado:</text>
  <text x="430" y="300" fill="#263238" font-size="11" font-family="Consolas,monospace">HTTP/1.1 200 OK</text>
  <text x="430" y="326" fill="#2e7d32" font-size="12" font-weight="700">Status Codes:</text>
  <rect x="430" y="336" width="50" height="20" rx="4" fill="#4caf50"/><text x="455" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">2xx</text>
  <rect x="488" y="336" width="50" height="20" rx="4" fill="#ff9800"/><text x="513" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">3xx</text>
  <rect x="546" y="336" width="50" height="20" rx="4" fill="#f44336"/><text x="571" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">4xx</text>
  <rect x="604" y="336" width="50" height="20" rx="4" fill="#b71c1c"/><text x="629" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">5xx</text>
  <text x="430" y="382" fill="#2e7d32" font-size="12" font-weight="700">Headers:</text>
  <text x="430" y="400" fill="#263238" font-size="11" font-family="Consolas,monospace">Content-Type: application/json</text>
  <text x="430" y="426" fill="#2e7d32" font-size="12" font-weight="700">Body (JSON):</text>
  <text x="430" y="444" fill="#263238" font-size="11" font-family="Consolas,monospace">{"result":{...},"id":1}</text>
</svg>
