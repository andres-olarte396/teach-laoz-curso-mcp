<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4e342e"/><stop offset="100%" stop-color="#795548"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#795548"/></marker>
  </defs>
  <rect width="800" height="480" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Claude Desktop Config y Servidores Locales</text>

  <!-- Claude Desktop UI -->
  <rect x="40" y="80" width="220" height="360" rx="12" fill="#fff" stroke="#795548" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="80" width="220" height="36" rx="12" fill="#795548"/>
  <rect x="40" y="100" width="220" height="16" fill="#795548"/>
  <text x="150" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Claude Desktop (Host)</text>
  
  <rect x="60" y="140" width="180" height="280" rx="6" fill="#efebe9"/>
  <rect x="70" y="160" width="160" height="40" rx="6" fill="#d7ccc8"/>
  <text x="150" y="185" text-anchor="middle" fill="#4e342e" font-size="11">Prompt Input...</text>
  <circle cx="90" cy="225" r="10" fill="#a1887f"/>
  <text x="110" y="230" fill="#4e342e" font-size="12" font-weight="600">Herramientas MCP</text>
  <line x1="70" y1="245" x2="230" y2="245" stroke="#bcaaa4" stroke-width="1"/>
  
  <text x="70" y="265" fill="#5d4037" font-size="11">✓ local_files (stdio)</text>
  <text x="70" y="285" fill="#5d4037" font-size="11">✓ mi_db (stdio)</text>
  
  <rect x="80" y="380" width="140" height="25" rx="4" fill="#8d6e63"/>
  <text x="150" y="396" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Settings -> Config</text>

  <!-- Config File -->
  <line x1="260" y1="260" x2="310" y2="260" stroke="#795548" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="285" y="250" text-anchor="middle" fill="#5d4037" font-size="11">Lee de</text>

  <rect x="320" y="80" width="440" height="200" rx="12" fill="#282c34" stroke="#795548" stroke-width="2" filter="url(#s)"/>
  <text x="340" y="110" fill="#fff" font-size="14" font-family="Consolas,monospace">claude_desktop_config.json</text>
  
  <text x="340" y="140" fill="#abb2bf" font-size="12" font-family="Consolas,monospace">{</text>
  <text x="360" y="160" fill="#e06c75" font-size="12" font-family="Consolas,monospace">"mcpServers"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">: {</text>
  <text x="380" y="180" fill="#e06c75" font-size="12" font-family="Consolas,monospace">"local_files"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">: {</text>
  <text x="400" y="200" fill="#e06c75" font-size="12" font-family="Consolas,monospace">"command"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">: </text><text fill="#98c379" font-size="12" font-family="Consolas,monospace">"npx"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">,</text>
  <text x="400" y="220" fill="#e06c75" font-size="12" font-family="Consolas,monospace">"args"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">: [</text><text fill="#98c379" font-size="12" font-family="Consolas,monospace">"-y"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">, </text><text fill="#98c379" font-size="12" font-family="Consolas,monospace">"@modelcontextprotocol/server-filesystem"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">, </text><text fill="#98c379" font-size="12" font-family="Consolas,monospace">"/usr"</text><text fill="#abb2bf" font-size="12" font-family="Consolas,monospace">]</text>
  <text x="380" y="240" fill="#abb2bf" font-size="12" font-family="Consolas,monospace">}</text>
  <text x="360" y="260" fill="#abb2bf" font-size="12" font-family="Consolas,monospace">}</text>
  <text x="340" y="280" fill="#abb2bf" font-size="12" font-family="Consolas,monospace">}</text>

  <!-- Process Spawning -->
  <line x1="540" y1="280" x2="540" y2="330" stroke="#795548" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="610" y="310" text-anchor="middle" fill="#5d4037" font-size="11">Claude lee el config y levanta el proceso (stdio)</text>

  <rect x="320" y="340" width="440" height="100" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#s)"/>
  <text x="540" y="365" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="700">Sub-Proceso (stdio transport)</text>
  <rect x="360" y="380" width="360" height="40" rx="6" fill="#fff"/>
  <text x="540" y="405" text-anchor="middle" fill="#2e7d32" font-size="12" font-family="Consolas,monospace">$ npx -y @modelcontextprotocol/server-filesystem /usr</text>
  
</svg>
