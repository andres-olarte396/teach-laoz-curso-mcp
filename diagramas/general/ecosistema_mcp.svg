<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#01579b"/><stop offset="100%" stop-color="#0288d1"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0288d1"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4caf50"/></marker>
  </defs>
  <rect width="800" height="520" rx="12" fill="#f5f7fa"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#h)"/>
  <rect x="0" y="24" width="800" height="32" fill="url(#h)"/>
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Ecosistema MCP</text>

  <!-- LLMs / Models -->
  <text x="400" y="86" text-anchor="middle" fill="#9c27b0" font-size="13" font-weight="700">Modelos de IA</text>
  <rect x="100" y="95" width="110" height="32" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5" filter="url(#s)"/><text x="155" y="116" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="600">Claude</text>
  <rect x="230" y="95" width="110" height="32" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5" filter="url(#s)"/><text x="285" y="116" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="600">GPT-4</text>
  <rect x="360" y="95" width="110" height="32" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5" filter="url(#s)"/><text x="415" y="116" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="600">Gemini</text>
  <rect x="490" y="95" width="110" height="32" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5" filter="url(#s)"/><text x="545" y="116" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="600">Llama</text>

  <!-- Hosts -->
  <text x="400" y="160" text-anchor="middle" fill="#0288d1" font-size="13" font-weight="700">Hosts (Aplicaciones de IA)</text>
  <rect x="60" y="170" width="130" height="50" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/><text x="125" y="192" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Claude Desktop</text><text x="125" y="208" text-anchor="middle" fill="#546e7a" font-size="9">Host oficial</text>
  <rect x="210" y="170" width="100" height="50" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/><text x="260" y="192" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Cursor</text><text x="260" y="208" text-anchor="middle" fill="#546e7a" font-size="9">IDE</text>
  <rect x="330" y="170" width="100" height="50" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/><text x="380" y="192" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">VS Code</text><text x="380" y="208" text-anchor="middle" fill="#546e7a" font-size="9">IDE</text>
  <rect x="450" y="170" width="100" height="50" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/><text x="500" y="192" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Zed</text><text x="500" y="208" text-anchor="middle" fill="#546e7a" font-size="9">IDE</text>
  <rect x="570" y="170" width="120" height="50" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#s)"/><text x="630" y="192" text-anchor="middle" fill="#01579b" font-size="10" font-weight="600">Custom Host</text><text x="630" y="208" text-anchor="middle" fill="#546e7a" font-size="9">Tu app</text>

  <!-- MCP Protocol Layer -->
  <rect x="60" y="245" width="680" height="50" rx="25" fill="#0288d1" filter="url(#s)"/>
  <text x="400" y="268" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Model Context Protocol (MCP)</text>
  <text x="170" y="285" text-anchor="middle" fill="#e1f5fe" font-size="10">JSON-RPC 2.0</text>
  <text x="400" y="285" text-anchor="middle" fill="#e1f5fe" font-size="10">stdio | SSE | Streamable HTTP</text>
  <text x="630" y="285" text-anchor="middle" fill="#e1f5fe" font-size="10">OAuth 2.1</text>

  <!-- MCP Servers -->
  <text x="400" y="325" text-anchor="middle" fill="#4caf50" font-size="13" font-weight="700">Servidores MCP</text>
  <rect x="20" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="70" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Filesystem</text><text x="70" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Archivos</text>
  <rect x="130" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="180" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">PostgreSQL</text><text x="180" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Base de datos</text>
  <rect x="240" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="290" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Git</text><text x="290" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Repositorios</text>
  <rect x="350" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="400" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Slack</text><text x="400" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Mensajería</text>
  <rect x="460" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="510" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">GitHub</text><text x="510" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Código</text>
  <rect x="570" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="620" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">Custom</text><text x="620" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Tu servidor</text>
  <rect x="680" y="335" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#s)"/><text x="730" y="355" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">+ 1000s</text><text x="730" y="370" text-anchor="middle" fill="#546e7a" font-size="9">Comunidad</text>

  <!-- Data Sources -->
  <text x="400" y="415" text-anchor="middle" fill="#ff9800" font-size="13" font-weight="700">Fuentes de Datos y Servicios</text>
  <rect x="85" y="425" width="110" height="32" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/><text x="140" y="446" text-anchor="middle" fill="#e65100" font-size="10">Bases de Datos</text>
  <rect x="215" y="425" width="110" height="32" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/><text x="270" y="446" text-anchor="middle" fill="#e65100" font-size="10">APIs REST</text>
  <rect x="345" y="425" width="110" height="32" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/><text x="400" y="446" text-anchor="middle" fill="#e65100" font-size="10">Cloud Storage</text>
  <rect x="475" y="425" width="110" height="32" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/><text x="530" y="446" text-anchor="middle" fill="#e65100" font-size="10">Repositorios</text>
  <rect x="605" y="425" width="110" height="32" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/><text x="660" y="446" text-anchor="middle" fill="#e65100" font-size="10">IoT / Hardware</text>

  <!-- Key message -->
  <rect x="120" y="475" width="560" height="28" rx="6" fill="#263238"/>
  <text x="400" y="494" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="600">1 protocolo estándar conecta TODOS los modelos con TODAS las herramientas</text>
</svg>
